services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leilao}
      POSTGRES_USER: ${POSTGRES_USER:-leilao}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD em .env.local}
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    read_only: true
    tmpfs:
      - /run
      - /var/run/postgresql
      - /tmp
    ulimits:
      nofile:
        soft: ${POSTGRES_NOFILE:-4096}
        hard: ${POSTGRES_NOFILE:-4096}
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS:-1}"
          memory: ${POSTGRES_MEM:-300m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
