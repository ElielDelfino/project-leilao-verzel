# Dependabot: atualizações semanais de npm (pnpm) e GitHub Actions (task 006; specs/014 §CI/CD).
# Cada PR do Dependabot roda o CI (minutos do repositório privado): atualizações menores agrupadas
# num PR por ecossistema e limite baixo de PRs abertos.
# Mensagens em Conventional Commits (commitlint): chore(deps)/chore(deps-dev) e ci(deps).
version: 2
updates:
  - package-ecosystem: npm
    # Workspace pnpm: raiz, apps e pacotes (pnpm-workspace.yaml).
    directories:
      - /
      - /apps/*
      - /packages/*
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-menores:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'
