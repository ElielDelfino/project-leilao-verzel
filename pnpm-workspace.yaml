# pnpm 12: só auth e registry são lidos do .npmrc; as demais configurações ficam aqui.
packages:
  - apps/*
  - packages/*

# Recusa dependências que declaram não suportar a versão do Node em uso.
engineStrict: true

# Scripts de build de dependências são bloqueados por padrão (strictDepBuilds).
# lefthook: o postinstall instala os git hooks (pre-commit e commit-msg).
# unrs-resolver: o binário nativo vem pela dependência opcional da plataforma; o postinstall
# (download de fallback) não é necessário.
# esbuild (via drizzle-kit, só em dev): idem; o binário vem do @esbuild/<plataforma> opcional e o
# postinstall só valida ou baixa o binário quando a dependência opcional falta.
# cpu-features e ssh2 (via @testcontainers/postgresql → dockerode, só em dev): o install compila
# addons nativos opcionais com node-gyp; o ssh2 carrega os dois em try/catch e cai no crypto do
# Node, e só é usado para Docker via SSH (o Testcontainers usa o socket local).
# protobufjs (via @grpc/proto-loader, idem): o postinstall só avisa sobre o esquema de versão.
# @scarf/scarf (via @redocly/cli, telemetria): o postinstall só envia analytics e não é necessário;
# a telemetria também é desligada no wrapper scripts/contracts-lint.mjs.
allowBuilds:
  '@scarf/scarf': false
  cpu-features: false
  esbuild: false
  lefthook: true
  protobufjs: false
  ssh2: false
  unrs-resolver: false
