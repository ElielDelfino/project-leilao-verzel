# Compose de produção (specs/014 §Produção, ADR 0023, 0024 e 0033): Postgres, Redis, API e Caddy
# na VPS, mais os one-shots `migrate` e `seed` (profile ops). Da raiz do repositório:
#   docker compose -p leilao-prod --env-file .env --env-file infra/prod.env \
#       -f infra/docker-compose.prod.yml up -d
#   docker compose -p leilao-prod --env-file .env --env-file infra/prod.env \
#       -f infra/docker-compose.prod.yml --profile ops run --rm migrate
# O .env traz os defaults de dev; o infra/prod.env, lido depois, troca os valores de produção
# (limites de memória, host público, diretório dos segredos). Cada interpolação abaixo repete o
# valor de produção como default, para o arquivo resolver o mesmo modelo sem os --env-file.
# O nome do projeto vem do `name:` (o .env não define COMPOSE_PROJECT_NAME); o -p só o repete.
# Nenhuma senha passa por `environment:`, `command:`, healthcheck ou build: as senhas são
# arquivos montados pelo Compose `secrets:` em /run/secrets/<nome> (ADR 0023). O
# /opt/leilao/.env.local da VPS nunca é passado ao Compose (ADR 0033, item 4.4).
#   LEILAO_SECRETS_DIR  diretório com os 6 arquivos de segredo (db_password, db_api_password,
#                       redis_password, jwt_secret, pseudonym_hmac_key, ed25519_private_key). Na
#                       VPS, /run/leilao/secrets, gravado por infra/deploy/materializar-segredos.sh.
#                       Para testar localmente, aponte para um diretório com os 6 arquivos (uid
#                       1000, 600, sem quebra de linha); o `config` não acusa a falta.
#   API_IMAGE, WEB_IMAGE  imagens a usar (prod: ghcr.io/<owner>/leilao-api:<sha> e leilao-web:<sha>,
#                       com `pull` e `up --no-build`); sem elas, o compose constrói as imagens locais.
#   BORDA_SUBNET        CIDR da rede `borda` (padrão 10.89.0.0/24), também passado à API como
#                       TRUSTED_PROXY_CIDR.
# Só o Caddy publica portas (80 e 443 TCP). Postgres e Redis ficam na rede `dados`, sem saída.
name: leilao-prod

# Logs do Docker (specs/014 §Observabilidade): json-file, 10 MB por arquivo, 5 arquivos.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

# Endereço do Postgres e ambiente comuns à API e aos one-shots (specs/014 §Conexão).
x-postgres-endereco: &postgres-endereco
  NODE_ENV: production
  TZ: ${TZ:-UTC}
  # Heap do Node em 75% do limite de RAM da API (ADR 0033, item 8). Os one-shots usam o mesmo
  # limite de contêiner da API.
  NODE_OPTIONS: --max-old-space-size=576
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-leilao}

# Contêiner Node da imagem da API (uid 1000, sem capabilities): API e one-shots.
x-node-endurecido: &node-endurecido
  read_only: true
  tmpfs:
    - /run:size=8m,nosuid,nodev,noexec
    - /tmp:size=16m,nosuid,nodev,noexec
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  ulimits:
    nofile:
      soft: ${API_NOFILE:-8192}
      hard: ${API_NOFILE:-8192}
  deploy:
    resources:
      limits:
        cpus: '${API_CPUS:-1}'
        memory: ${API_MEM:-768m}
        pids: ${API_PIDS:-128}
  # RAM + swap: 2× o limite só para Postgres e API (ADR 0024, item 2).
  memswap_limit: ${API_MEMSWAP:-1536m}
  logging: *logging

# Imagem da API: construída só no GitHub Actions em produção (ADR 0033, item 5.1). O contexto
# nomeado `migrations` entra na imagem (apps/api/Dockerfile); o .dockerignore da raiz o exclui do
# contexto principal.
x-imagem-da-api: &imagem-da-api
  image: ${API_IMAGE:-leilao-api:local}
  build:
    context: ..
    dockerfile: apps/api/Dockerfile
    additional_contexts:
      migrations: ../database/postgres/migrations

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leilao}
      POSTGRES_USER: ${POSTGRES_USER:-leilao}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      TZ: ${TZ:-UTC}
    secrets:
      - db_password
    networks:
      - dados
    volumes:
      - pgdata:/var/lib/postgresql
    read_only: true
    tmpfs:
      - /run:size=8m,nosuid,nodev,noexec
      - /var/run/postgresql:size=8m,nosuid,nodev,noexec
      - /tmp:size=16m,nosuid,nodev,noexec
    # Mesmas capabilities do compose de dev (database/postgres/docker-compose.yml, tarefa 023): só
    # o entrypoint, como root, as usa. DAC_READ_SEARCH lê o segredo (dono uid 1000 no host, 600) e
    # percorre o PGDATA (700, dono postgres) só para leitura, sem a escrita que o DAC_OVERRIDE
    # daria; CHOWN dá o PGDATA ao usuário postgres; SETUID e SETGID trocam de usuário (gosu). O
    # postgres roda sem nenhuma.
    # Não acrescente `user:`: o entrypoint precisa começar como root para ler o segredo e fazer o
    # chown, e o healthcheck (pg_isready) roda como root. Um `user:` exige rever os dois e este cap_add.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: ${POSTGRES_NOFILE:-4096}
        hard: ${POSTGRES_NOFILE:-4096}
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPUS:-1}'
          memory: ${POSTGRES_MEM:-1g}
          pids: ${POSTGRES_PIDS:-200}
    # RAM + swap (ADR 0024 e 0033): o banco pode usar swap até 2× o limite em vez de ser morto pelo
    # OOM do cgroup.
    memswap_limit: ${POSTGRES_MEMSWAP:-2g}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
      start_interval: 1s
    # Fast shutdown do Postgres (STOPSIGNAL SIGINT da imagem) com tempo para o checkpoint.
    stop_grace_period: 30s
    logging: *logging
    restart: always

  redis:
    image: ${REDIS_IMAGE:-redis:8.8.3-alpine}
    # Igual ao dev (cache/redis/docker-compose.yml): valida o charset base64url da senha, grava
    # `requirepass` num redis.conf no tmpfs /run (600, dono redis) e segue o entrypoint oficial.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        umask 077
        arquivo=/run/secrets/redis_password
        if [ ! -r "$$arquivo" ]; then
          echo "redis: $$arquivo ausente ou ilegível" >&2
          exit 1
        fi
        senha=$$(cat "$$arquivo")
        case "$$senha" in
          '' | *[!A-Za-z0-9_-]*)
            echo "redis: $$arquivo vazio ou fora de base64url (A-Z a-z 0-9 - _)" >&2
            exit 1
            ;;
        esac
        mkdir -p /run/redis
        printf 'requirepass %s\n' "$$senha" > /run/redis/redis.conf
        unset senha
        chown -R redis:redis /run/redis
        exec docker-entrypoint.sh "$$@"
      - redis-entrypoint
    command:
      - redis-server
      - /run/redis/redis.conf
      - --maxmemory
      - ${REDIS_MAXMEMORY:-96mb}
      - --maxmemory-policy
      - volatile-lru
      - --save
      - ''
      - --appendonly
      - 'no'
    secrets:
      - redis_password
    networks:
      - dados
    read_only: true
    tmpfs:
      - /run:size=8m,nosuid,nodev,noexec
      - /tmp:size=8m,nosuid,nodev,noexec
      # O entrypoint da imagem carrega todo .so deste diretório (search, json, bloom, timeseries).
      # Nenhuma spec usa esses módulos: um tmpfs vazio por cima faz o Redis subir sem eles.
      - /usr/local/lib/redis/modules:size=64k,mode=0555,nosuid,nodev,noexec
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: ${REDIS_NOFILE:-4096}
        hard: ${REDIS_NOFILE:-4096}
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPUS:-0.5}'
          memory: ${REDIS_MEM:-128m}
          pids: ${REDIS_PIDS:-64}
    # Sem swap (ADR 0024 e 0033): o maxmemory limita o Redis abaixo do limite do contêiner, e sem
    # persistência não há fork.
    memswap_limit: ${REDIS_MEMSWAP:-128m}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s
    logging: *logging
    restart: always

  api:
    <<: [*node-endurecido, *imagem-da-api]
    environment:
      <<: *postgres-endereco
      API_PORT: ${API_PORT:-13000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCRYFALL_USER_AGENT: ${SCRYFALL_USER_AGENT:-LeilaoVerzel/0.1}
      # A API conecta como o papel `leilao_api` (ADR 0026), nunca como o dono `leilao`.
      POSTGRES_API_USER: ${POSTGRES_API_USER:-leilao_api}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Rede de onde vem o X-Forwarded-For confiável: a `borda` (a única por onde o Caddy alcança a
      # API). Só nome e valor, nunca segredo. A API a lê na tarefa 140 para o `trustProxy`.
      TRUSTED_PROXY_CIDR: ${BORDA_SUBNET:-10.89.0.0/24}
      # Origem pública da SPA (CORS e cookies `Secure`, specs/003 e ADR 0027).
      WEB_ORIGIN: https://${CADDY_SITE_ADDRESS:-teste-verzel.duckdns.org}
      # Caminhos (não os valores) dos 5 segredos da API: ela lê <VAR> ou <VAR>_FILE (ADR 0023). Sem
      # DB_PASSWORD_FILE: a senha do dono do banco não chega à API (specs/014 §Segredos, ADR 0026).
      DB_API_PASSWORD_FILE: /run/secrets/db_api_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      PSEUDONYM_HMAC_KEY_FILE: /run/secrets/pseudonym_hmac_key
      ED25519_PRIVATE_KEY_FILE: /run/secrets/ed25519_private_key
    # Os arquivos montados por `secrets:` (bind) mantêm dono e modo do host; uid/gid/mode do
    # Compose valem só no Swarm. A API roda como uid 1000 sem capabilities, então os arquivos que
    # ela lê precisam ser do uid 1000 e só dele: 600, diretório 700 (materializar-segredos.sh na
    # VPS; specs/014 §Segredos). O Postgres e o Redis leem como root no entrypoint
    # (DAC_READ_SEARCH).
    secrets:
      - db_api_password
      - redis_password
      - jwt_secret
      - pseudonym_hmac_key
      - ed25519_private_key
    # borda: alcançada pelo Caddy e com saída para a Scryfall; dados: Postgres e Redis.
    networks:
      - borda
      - dados
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthcheck: o HEALTHCHECK de apps/api/Dockerfile.
    restart: always

  # One-shot de migrations (specs/014 §Produção e §CI/CD): só roda quando chamado, com
  # `--profile ops run --rm migrate`. Conecta como o dono e aplica a senha do papel da API (ADR
  # 0026), por isso recebe só DB_PASSWORD_FILE e DB_API_PASSWORD_FILE.
  migrate:
    <<: [*node-endurecido, *imagem-da-api]
    profiles: [ops]
    command: ['node', 'dist/db/migrate.js']
    environment:
      <<: *postgres-endereco
      POSTGRES_USER: ${POSTGRES_USER:-leilao}
      POSTGRES_API_USER: ${POSTGRES_API_USER:-leilao_api}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_API_PASSWORD_FILE: /run/secrets/db_api_password
    secrets:
      - db_password
      - db_api_password
    # Só a rede de dados: o one-shot não fala com a internet nem com o Caddy.
    networks:
      - dados
    depends_on:
      postgres:
        condition: service_healthy
    # O HEALTHCHECK da imagem é o da API (porta 13000); num one-shot ele só falharia.
    healthcheck:
      disable: true
    restart: 'no'

  # One-shot de seed (specs/014 §Produção): `--profile ops run --rm seed`, depois do migrate.
  # Conecta como o dono (DB_PASSWORD_FILE). As etapas de hoje (identidade: contas demo) usam só
  # SEED_DEMO_PASSWORD, que não é segredo (specs/003 RF-03); nenhum outro secret é montado.
  seed:
    <<: [*node-endurecido, *imagem-da-api]
    profiles: [ops]
    command: ['node', 'dist/db/seed.js']
    environment:
      <<: *postgres-endereco
      POSTGRES_USER: ${POSTGRES_USER:-leilao}
      DB_PASSWORD_FILE: /run/secrets/db_password
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-leilao-demo-2026}
    secrets:
      - db_password
    networks:
      - dados
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: 'no'

  caddy:
    image: ${WEB_IMAGE:-leilao-web:local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-teste-verzel.duckdns.org}
      API_PORT: ${API_PORT:-13000}
      # Teto de heap do runtime Go em 75% do limite do contêiner (o GC aperta antes do OOM).
      GOMEMLIMIT: ${CADDY_GOMEMLIMIT:-96MiB}
    networks:
      - borda
    depends_on:
      api:
        condition: service_healthy
    # Única exceção a portas < 1024 (80 e 443 TCP, ADR 0033 item 3.4), publicadas em todas as
    # interfaces do host, IPv4 e IPv6. Sem 443/udp: HTTP/3 desligado (ADR 0024). Para testes
    # locais com as portas ocupadas: CADDY_HTTP_PORT e CADDY_HTTPS_PORT.
    ports:
      - '${CADDY_HTTP_PORT:-80}:80/tcp'
      - '${CADDY_HTTPS_PORT:-443}:443/tcp'
    # O Caddy roda como o usuário caddy (uid 10001) sem NET_BIND_SERVICE: liberar portas baixas
    # no namespace de rede do próprio contêiner não afeta o host.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      # Conta ACME e certificados do Let's Encrypt: precisam persistir (limite de 5 certificados
      # idênticos por semana; specs/014 §Produção). Não é cache: nunca `down -v`.
      - caddy_data:/data
    read_only: true
    tmpfs:
      - /run:size=8m,nosuid,nodev,noexec
      - /tmp:size=8m,nosuid,nodev,noexec
      # XDG_CONFIG_HOME do Caddy: com persist_config off nada é gravado aqui, e o que fosse é
      # derivado do Caddyfile (não precisa persistir).
      - /config:size=1m,uid=10001,gid=10001,mode=0700,nosuid,nodev,noexec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: ${CADDY_NOFILE:-8192}
        hard: ${CADDY_NOFILE:-8192}
    # 128 MB para TLS + WebSocket, sem swap (memswap igual ao limite): ADR 0033, item 8.
    deploy:
      resources:
        limits:
          cpus: '${CADDY_CPUS:-0.5}'
          memory: ${CADDY_MEM:-128m}
          pids: ${CADDY_PIDS:-64}
    memswap_limit: ${CADDY_MEMSWAP:-128m}
    # Healthcheck: o HEALTHCHECK de apps/web/Dockerfile (http://127.0.0.1:2020/saude).
    logging: *logging
    restart: always

networks:
  # Subnet fixa (10.89.0.0/24, fora dos pools padrão do Docker, 172.17-31.0.0/16 e 192.168.0.0/16):
  # é o que a API confia como proxy (TRUSTED_PROXY_CIDR). Só o Caddy e a API estão nela. Troque a
  # faixa em BORDA_SUBNET se colidir com a rede da VPS; o CIDR da API segue a mesma variável.
  borda:
    ipam:
      config:
        - subnet: ${BORDA_SUBNET:-10.89.0.0/24}
  # Sem rota para fora: Postgres e Redis só falam com a API e com os one-shots.
  dados:
    internal: true

secrets:
  db_password:
    file: ${LEILAO_SECRETS_DIR:-/run/leilao/secrets}/db_password
  db_api_password:
    file: ${LEILAO_SECRETS_DIR:-/run/leilao/secrets}/db_api_password
  redis_password:
    file: ${LEILAO_SECRETS_DIR:-/run/leilao/secrets}/redis_password
  jwt_secret:
    file: ${LEILAO_SECRETS_DIR:-/run/leilao/secrets}/jwt_secret
  pseudonym_hmac_key:
    file: ${LEILAO_SECRETS_DIR:-/run/leilao/secrets}/pseudonym_hmac_key
  ed25519_private_key:
    file: ${LEILAO_SECRETS_DIR:-/run/leilao/secrets}/ed25519_private_key

# Nomes explícitos e fixos: o compose de produção nunca anexa o volume leilao_pgdata do dev,
# qualquer que seja o projeto.
volumes:
  pgdata:
    name: leilao-prod_pgdata
  caddy_data:
    name: leilao-prod_caddy_data
