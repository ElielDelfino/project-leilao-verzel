# Casa de Leilões: SSH só por chave (ADR 0033 item 3.2, specs/014 §Servidor).
# Instalado em /etc/ssh/sshd_config.d/00-leilao.conf por infra/vps/preparar-vps.sh, que troca
# o marcador da linha AllowUsers pelo nome do administrador. No sshd vale o primeiro valor lido de cada opção: o prefixo
# 00- faz este arquivo vencer outro de sshd_config.d (por exemplo, um 50-cloud-init.conf da imagem
# que ligue a senha). Confira sempre o valor efetivo com `sudo sshd -T`.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AllowUsers @ADMIN@ deploy
