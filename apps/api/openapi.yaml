# Contrato REST (OpenAPI 3.1). Fonte: specs/001 e specs/003–011. Dono: spec-guardian.
# F1 (tarefa 009): rotas de specs/003 (auth) e specs/004 (carteira). F2 (tarefa 049): rotas de
# specs/005 (catálogo, imagens) e specs/006 (lotes, painel). F3 (tarefa 070): rotas de specs/007
# (lances) e specs/008 (auditoria). F4 (tarefa 100): rotas de specs/006 e 010 (cancelamento) e de
# specs/011 (comprovante, meus arremates). As demais fases acrescentam as suas.
# Ponto de atenção: Centavos e Pseudonimo são duplicados em eventbus/socketio/asyncapi.yaml; mude os
# dois juntos.
openapi: 3.1.0
info:
  title: Casa de Leilões API
  version: 0.6.0
  license: { name: MIT, identifier: MIT }
  description: |
    Envelope (specs/001 §Contratos): sucesso `{ sucesso: true, dados }`; erro
    `{ sucesso: false, erro: { codigo, mensagem, detalhes? } }`. Dinheiro sempre em centavos inteiros.
    Rotas que alteram estado (POST/PUT/PATCH/DELETE) exigem o header `X-CSRF-Token` igual ao cookie
    `csrf_token` (double-submit, specs/003); a SPA obtém o cookie em `GET /api/auth/csrf` antes do
    primeiro POST. Corpo com campo desconhecido responde 422 `DADOS_INVALIDOS`.

    Toda rota declara `default` com o envelope `Erro`: ele cobre os 4xx que o framework responde
    antes ou fora da rota (JSON malformado, corpo grande, content-type não suportado, rota
    inexistente) e o 500 `INDISPONIVEL` de erro não tratado. Tradução de status em código e nível
    de log em specs/001 §Erros. Nenhuma resposta de erro leva stack, SQL, mensagem interna ou a URL
    da requisição.
servers:
  - url: http://localhost:13000
tags:
  - name: health
    description: Health checks (ADR 0018).
  - name: auth
    description: CSRF, cadastro, login, refresh, logout e sessão (specs/003).
  - name: carteira
    description: Saldo, depósito simulado e extrato do ledger (specs/004).
  - name: catalogo
    description: Busca de cartas na Scryfall, só leiloeiro (specs/005).
  - name: imagens
    description: Imagem do snapshot da carta, pública (specs/005).
  - name: lotes
    description: Vitrine e detalhe do lote, públicos (specs/006).
  - name: painel
    description: Criação e cancelamento de lotes, lista e resumo do leiloeiro (specs/006, specs/010).
  - name: lances
    description: Lance, histórico público do lote e lances do usuário (specs/007).
  - name: auditoria
    description: Cadeia de lances, veredito do servidor e chaves públicas, públicos (specs/008).
  - name: comprovantes
    description: Comprovante público de arremate e "Meus arremates" do licitante (specs/011).
paths:
  /api/health/live:
    get:
      tags: [health]
      operationId: healthLive
      summary: Processo vivo, sem consultar dependências (specs/014 §Observabilidade)
      security: []
      responses:
        '200': { $ref: '#/components/responses/SaudeOk' }
        default: { $ref: '#/components/responses/Erro' }
  /api/health/ready:
    get:
      tags: [health]
      operationId: healthReady
      summary: Pronto (Postgres e Redis respondendo; specs/014 §Observabilidade)
      description: |
        Cada verificação tem 2 s para responder. Com qualquer dependência fora, ou sem verificações
        registradas, responde 503 `INDISPONIVEL` sem `detalhes`: a resposta não diz qual dependência
        falhou (o nome e o motivo vão só para o log).
      security: []
      responses:
        '200': { $ref: '#/components/responses/SaudeOk' }
        '503': { $ref: '#/components/responses/ErroIndisponivel' }
        default: { $ref: '#/components/responses/Erro' }

  /api/auth/csrf:
    get:
      tags: [auth]
      operationId: authCsrf
      summary: Emite um cookie `csrf_token` novo, sem autenticação (specs/003)
      description: A SPA chama esta rota antes do primeiro POST, inclusive antes do cadastro e do login.
      security: []
      responses:
        '204':
          description: Cookie `csrf_token` emitido.
          headers:
            Set-Cookie: { $ref: '#/components/headers/CookieCsrf' }
        default: { $ref: '#/components/responses/Erro' }

  /api/auth/cadastro:
    post:
      tags: [auth]
      operationId: authCadastro
      summary: Cadastro público com papel imutável (specs/003 RF-01)
      description: Limite de 5 cadastros por minuto por IP (specs/003 RNF-04).
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroEntrada' }
      responses:
        '201':
          description: Conta criada e sessão iniciada.
          headers:
            Set-Cookie: { $ref: '#/components/headers/CookiesDeSessao' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaUsuarioLogado' }
        '403': { $ref: '#/components/responses/ErroCsrfInvalido' }
        '409': { $ref: '#/components/responses/ErroEmailEmUso' }
        '422': { $ref: '#/components/responses/ErroDadosInvalidos' }
        '429': { $ref: '#/components/responses/ErroMuitasTentativas' }
        default: { $ref: '#/components/responses/Erro' }

  /api/auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      summary: Login por e-mail e senha (specs/003 RF-02)
      description: |
        Mesma resposta para e-mail inexistente e senha errada (specs/003 RNF-03).
        Limite de 5 tentativas por minuto por IP + e-mail (specs/003 RNF-02).
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginEntrada' }
      responses:
        '200':
          description: Sessão iniciada.
          headers:
            Set-Cookie: { $ref: '#/components/headers/CookiesDeSessao' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaUsuarioLogado' }
        '401': { $ref: '#/components/responses/ErroCredenciaisInvalidas' }
        '403': { $ref: '#/components/responses/ErroCsrfInvalido' }
        '422': { $ref: '#/components/responses/ErroDadosInvalidos' }
        '429': { $ref: '#/components/responses/ErroMuitasTentativas' }
        default: { $ref: '#/components/responses/Erro' }

  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      summary: Troca o refresh token por um par novo, na mesma família (specs/003)
      description: |
        Lê o cookie `refresh_token`. Reuso de um token já substituído revoga a família inteira e
        responde 401 `SESSAO_EXPIRADA`.
      security:
        - cookieRefresh: []
          csrf: []
      responses:
        '204':
          description: Cookies renovados.
          headers:
            Set-Cookie: { $ref: '#/components/headers/CookiesDeSessao' }
        '401': { $ref: '#/components/responses/ErroSessaoExpirada' }
        '403': { $ref: '#/components/responses/ErroCsrfInvalido' }
        default: { $ref: '#/components/responses/Erro' }

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Encerra a sessão e revoga a família do refresh token (specs/003)
      description: |
        Lê o cookie `refresh_token` (Path=/api/auth) e revoga a família dele, se houver. Responde 204
        mesmo sem sessão e expira os três cookies com os mesmos Path com que foram emitidos.
      security:
        - csrf: []
      responses:
        '204':
          description: Sessão encerrada; os cookies de sessão são expirados.
          headers:
            Set-Cookie: { $ref: '#/components/headers/CookiesExpirados' }
        '403': { $ref: '#/components/responses/ErroCsrfInvalido' }
        default: { $ref: '#/components/responses/Erro' }

  /api/auth/me:
    get:
      tags: [auth]
      operationId: authMe
      summary: Usuário da sessão atual (specs/003 RF-02)
      responses:
        '200':
          description: Usuário autenticado.
          content:
            application/json:
              schema:
                type: object
                required: [sucesso, dados]
                additionalProperties: false
                properties:
                  sucesso: { const: true }
                  dados: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/ErroNaoAutenticado' }
        default: { $ref: '#/components/responses/Erro' }

  /api/carteira:
    get:
      tags: [carteira]
      operationId: carteiraSaldo
      summary: Saldo do usuário, para os dois papéis (specs/004 RF-01, RF-02)
      description: disponivelCentavos = totalCentavos − comprometidoCentavos.
      responses:
        '200':
          description: Saldo atual (projeção `wallet_balances`).
          content:
            application/json:
              schema:
                type: object
                required: [sucesso, dados]
                additionalProperties: false
                properties:
                  sucesso: { const: true }
                  dados: { $ref: '#/components/schemas/Saldo' }
        '401': { $ref: '#/components/responses/ErroNaoAutenticado' }
        default: { $ref: '#/components/responses/Erro' }

  /api/carteira/depositos:
    post:
      tags: [carteira]
      operationId: carteiraDepositar
      summary: Depósito simulado, só licitante (specs/004 RF-03)
      description: |
        Valor entre 100 e 10.000.000 centavos (R$ 1,00 a R$ 100.000,00) por operação.
        Idempotente por (usuário, `Idempotency-Key`): repetir a chave com o mesmo corpo responde 200
        com o mesmo lançamento e o saldo atual; repetir a chave com corpo diferente responde 422
        `DADOS_INVALIDOS`. Nos dois casos, nenhum lançamento novo é gravado (specs/004).
        Leiloeiro recebe 403 `PAPEL_NAO_PERMITIDO`.
      security:
        - cookieAcesso: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositoEntrada' }
      responses:
        '201':
          description: Depósito lançado no ledger.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaDeposito' }
        '200':
          description: Repetição da mesma `Idempotency-Key` com o mesmo corpo; mesmo lançamento, saldo atual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaDeposito' }
        '401': { $ref: '#/components/responses/ErroNaoAutenticado' }
        '403': { $ref: '#/components/responses/ErroCsrfOuPapel' }
        '422': { $ref: '#/components/responses/ErroDadosInvalidos' }
        default: { $ref: '#/components/responses/Erro' }

  /api/carteira/extrato:
    get:
      tags: [carteira]
      operationId: carteiraExtrato
      summary: Lançamentos do ledger do usuário, paginados, para os dois papéis (specs/004)
      description: Ordem do mais recente para o mais antigo; 20 lançamentos por página (`meta.limite` = 20).
      parameters:
        - $ref: '#/components/parameters/Pagina'
      responses:
        '200':
          description: Página do extrato.
          content:
            application/json:
              schema:
                type: object
                required: [sucesso, dados, meta]
                additionalProperties: false
                properties:
                  sucesso: { const: true }
                  dados:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/Lancamento' }
                  meta: { $ref: '#/components/schemas/MetaPaginacao' }
        '401': { $ref: '#/components/responses/ErroNaoAutenticado' }
        '422': { $ref: '#/components/responses/ErroDadosInvalidos' }
        default: { $ref: '#/components/responses/Erro' }

  /api/catalogo/cartas:
    get:
      tags: [catalogo]
      operationId: catalogoBuscarCartas
      summary: Busca de cartas na Scryfall, só leiloeiro (specs/005 RF-01)
      description: |
        `q` de 1 a 200 caracteres (sintaxe da Scryfall) e `pagina` de 1 a 500; 25 cartas por página
        (`meta.limite` = 25), mapeadas sobre as páginas de 175 da Scryfall (specs/005 §Busca). Nenhuma
        carta, ou página além da última, é 200 com lista vazia e `total` 0. Sintaxe recusada pela
        Scryfall é 422 com `detalhes.campo` `q`. Ordem: validação, cache (responde mesmo com o
        circuito aberto), circuito, ficha do bucket, chamada à Scryfall. Todo 503 de catálogo leva
        `detalhes.tenteNovamenteEm` e o header `Retry-After` com o mesmo valor. `imagemUrl` é a
        miniatura da própria Scryfall (ADR 0029), sem passar pelo servidor.
      parameters:
        - name: q
          in: query
          required: true
          description: Busca em texto, sem espaços nas pontas.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '#/components/parameters/PaginaLimitada'
      responses:
        '200':
          description: Página de cartas.
          content:
            application/json:
              schema:
                type: object
                required: [sucesso, dados, meta]
                additionalProperties: false
                properties:
                  sucesso: { const: true }
                  dados:
                    type: array
                    maxItems: 25
                    items: { $ref: '#/components/schemas/CartaDaBusca' }
                  meta: { $ref: '#/components/schemas/MetaPaginacao' }
        '401': { $ref: '#/components/responses/ErroNaoAutenticado' }
        '403': { $ref: '#/components/responses/ErroPapelNaoPermitido' }
        '422': { $ref: '#/components/responses/ErroDadosInvalidosComCampo' }
        '503': { $ref: '#/components/responses/ErroCatalogo' }
        default: { $ref: '#/components/responses/Erro' }

  /api/imagens/{snapshotId}:
    get:
      tags: [imagens]
      operationId: imagemDoSnapshot
      summary: Imagem `normal` do snapshot da carta, pública (specs/005)
      description: |
        Bytes do JPEG ou PNG gravado no snapshot, sem o envelope. Imutável: `Cache-Control: public,
        max-age=31536000, immutable`; `ETag` é o SHA-256 dos bytes em hexadecimal minúsculo entre
        aspas. `If-None-Match` igual ao `ETag` responde 304 sem corpo. Id inexistente, ou que não é
        UUID, responde 404 `NAO_ENCONTRADO`. Nunca chama a Scryfall.
      security: []
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string, maxLength: 80 }
      responses:
        '200':
          description: Imagem do snapshot.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlImagem' }
            ETag: { $ref: '#/components/headers/ETagImagem' }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '304':
          description: O `If-None-Match` casa com o `ETag`; sem corpo.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlImagem' }
            ETag: { $ref: '#/components/headers/ETagImagem' }
        '404': { $ref: '#/components/responses/ErroNaoEncontrado' }
        default: { $ref: '#/components/responses/Erro' }

  /api/lotes:
    get:
      tags: [lotes]
      operationId: lotesListar
      summary: Vitrine pública de lotes, com busca, filtros e ordenação (specs/006 RF-02, RF-03)
      description: |
        24 lotes por página (`meta.limite` = 24); `pagina` além da última é 200 com lista vazia. O
        `status` é derivado dos horários (specs/006 §Estados e status derivado); sem `status`, vêm
        os três; cancelados nunca aparecem. `q` busca `ILIKE %q%` em título e nome da carta, com `%`,
        `_` e `\` literais. A faixa de preço usa `coalesce(lance atual, lance inicial)`, em centavos,
        fechada nas duas pontas. Desempate de toda ordenação: `id` decrescente. Nenhum nome nem
        e-mail de usuário na resposta.
      security: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [ao_vivo, agendado, encerrado] }
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: precoMin
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 10000000000 }
        - name: precoMax
          in: query
          required: false
          description: Maior ou igual a `precoMin`; senão, 422 com `detalhes.campo` `precoMax`.
          schema: { type: integer, minimum: 0, maximum: 10000000000 }
        - name: raridade
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Raridade' }
        - name: ordem
          in: query
          required: false
          description: |
            `termina_antes` (`fim_em` crescente), `mais_recente` (`criado_em` decrescente) ou
            `maior_lance` (preço decrescente).
          schema: { type: string, enum: [termina_antes, mais_recente, maior_lance], default: termina_antes }
        - $ref: '#/components/parameters/PaginaLimitada'
      responses:
        '200':
          description: Página de lotes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaListaDeLotes' }
        '422': { $ref: '#/components/responses/ErroDadosInvalidosComCampo' }
        default: { $ref: '#/components/responses/Erro' }

  /api/lotes/{id}:
    get:
      tags: [lotes]
      operationId: lotesDetalhar
      summary: Detalhe do lote, público com sessão opcional (specs/006 §Detalhe)
      description: |
        Sessão opcional (`@SessaoOpcional()`, specs/003): sem cookie, ou com cookie inválido ou
        expirado, responde 200 como anônimo; nunca 401. Lote `cancelado` é 200 com `status`
        `cancelado`. Id inexistente, ou que não é UUID, é 404 `NAO_ENCONTRADO`. `suaPosicao` é
        `ganhando` (lote ao vivo e o usuário lidera), `venceu` (lote encerrado e o usuário venceu) ou
        `null`. Sem nome nem e-mail de usuário.
      security:
        - {}
        - cookieAcesso: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Lote com o snapshot da carta, sem a imagem.
          content:
            application/json:
              schema:
                type: object
                required: [sucesso, dados]
                additionalProperties: false
                properties:
                  sucesso: { const: true }
                  dados: { $ref: '#/components/schemas/LoteDetalhe' }
        '404': { $ref: '#/components/responses/ErroNaoEncontrado' }
        default: { $ref: '#/components/responses/Erro' }

  /api/lotes/{id}/lances:
    post:
      tags: [lances]
      operationId: lancesAceitar
      summary: Dá um lance no lote, só licitante (specs/007)
      description: |
        Uma transação com `FOR UPDATE` no lote (specs/007 §Transação). Antes dela, nesta ordem: CSRF
        (403 `CSRF_INVALIDO`), sessão (401), papel (403 `LEILOEIRO_NAO_PODE_LANCAR`; a rota não usa o
        `PAPEL_NAO_PERMITIDO` global, ADR 0031), validação (422 `DADOS_INVALIDOS`: `valorCentavos`
        inteiro de 1 a 9007199254740991 e `Idempotency-Key` UUID obrigatório), limite de 10 tentativas
        por segundo por usuário (429 `MUITAS_TENTATIVAS` com `Retry-After: 1`; Redis fora → 500
        `INDISPONIVEL`) e lote inexistente ou id que não é UUID (404 `NAO_ENCONTRADO`).

        Dentro da transação, depois do lock: repetição da `Idempotency-Key` com o mesmo lote e o mesmo
        valor → 200 com o `lance` original e o `lote` atual, sem efeito novo; outro lote ou outro valor
        → 422 `DADOS_INVALIDOS`. Depois, as recusas, nesta ordem, todas 422: `LOTE_ENCERRADO`,
        `LOTE_NAO_INICIADO`, `JA_ESTA_GANHANDO`, `LANCE_ABAIXO_DO_MINIMO` (`detalhes.minimoCentavos`) e
        `SALDO_INSUFICIENTE` (`detalhes.disponivelCentavos`). Contenção de lock além de 5 s → 503
        `INDISPONIVEL`. Lance aceito a menos de 2 minutos do fim estende o fim para agora + 2 minutos
        (o `fimEm` da resposta já é o novo).
      security:
        - cookieAcesso: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LanceEntrada' }
            example: { valorCentavos: 16500 }
      responses:
        '201':
          description: Lance aceito, gravado na cadeia e comprometido na carteira.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaLance' }
              example:
                sucesso: true
                dados:
                  lance:
                    seq: 2
                    pseudonimo: 'Licitante #b04e7d'
                    valorCentavos: 16500
                    criadoEm: '2026-10-27T14:03:41.907Z'
                  lote:
                    lanceAtualCentavos: 16500
                    fimEm: '2026-10-27T14:30:00.000Z'
                    totalLances: 2
        '200':
          description: |
            Repetição da mesma `Idempotency-Key` com o mesmo lote e o mesmo valor; o `lance` original e o
            `lote` de agora, sem lance, lançamento, evento nem extensão novos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaLance' }
        '401': { $ref: '#/components/responses/ErroNaoAutenticado' }
        '403': { $ref: '#/components/responses/ErroCsrfOuLeiloeiro' }
        '404': { $ref: '#/components/responses/ErroNaoEncontrado' }
        '422': { $ref: '#/components/responses/ErroLanceRecusado' }
        '429': { $ref: '#/components/responses/ErroMuitasTentativas' }
        '503': { $ref: '#/components/responses/ErroIndisponivel' }
        default: { $ref: '#/components/responses/Erro' }
    get:
      tags: [lances]
      operationId: lancesListarDoLote
      summary: Histórico público de lances do lote, pseudonimizado (specs/007)
      description: |
        Por `seq` decrescente, **50 por página** (`meta.limite` = 50); `pagina` de 1 a 500; além da
        última, 200 com lista vazia e o `total` real. Só pseudônimo: nunca nome, e-mail nem id de
        usuário. Lote inexistente, ou id que não é UUID, é 404 `NAO_ENCONTRADO`; `pagina` fora do
        intervalo é 422 com `detalhes.campo` `pagina`. Nunca cacheada (`Cache-Control: no-store`),
        porque o lote pode estar ao vivo.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/PaginaLimitada'
      responses:
        '200':
          description: Página de lances.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaListaDeLances' }
              example:
                sucesso: true
                dados:
                  - seq: 2
                    pseudonimo: 'Licitante #b04e7d'
                    valorCentavos: 16500
                    criadoEm: '2026-10-27T14:03:41.907Z'
                  - seq: 1
                    pseudonimo: 'Licitante #3fa9c1'
                    valorCentavos: 15000
                    criadoEm: '2026-10-27T14:03:07.120Z'
                meta: { total: 2, pagina: 1, limite: 50 }
        '404': { $ref: '#/components/responses/ErroNaoEncontrado' }
        '422': { $ref: '#/components/responses/ErroDadosInvalidosComCampo' }
        default: { $ref: '#/components/responses/Erro' }

  /api/me/lances:
    get:
      tags: [lances]
      operationId: meLancesListar
      summary: Lotes em que o licitante deu lance, com a posição atual (specs/007)
      description: |
        Um item por lote em que o usuário deu lance, ordenado por `meuUltimoLanceEm` decrescente
        (desempate `lote.id` decrescente); **24 por página** (`meta.limite` = 24); `pagina` de 1 a 500;
        além da última, 200 com lista vazia. Só licitante: leiloeiro recebe 403 `PAPEL_NAO_PERMITIDO`.
        `posicao` segue a tabela de specs/007 §Posição do usuário no lote. Nunca cacheada.
      security:
        - cookieAcesso: []
      parameters:
        - $ref: '#/components/parameters/PaginaLimitada'
      responses:
        '200':
          description: Página dos lotes com lance do usuário.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaMeusLances' }
        '401': { $ref: '#/components/responses/ErroNaoAutenticado' }
        '403': { $ref: '#/components/responses/ErroPapelNaoPermitido' }
        '422': { $ref: '#/components/responses/ErroDadosInvalidosComCampo' }
        default: { $ref: '#/components/responses/Erro' }

  /api/auditoria/lotes/{id}:
    get:
      tags: [auditoria]
      operationId: auditoriaDoLote
      summary: Cadeia inteira de lances, selo e veredito do servidor, público (specs/008)
      description: |
        Devolve a cadeia **inteira, sem paginação** (ADR 0031): o navegador precisa de todos os lances
        para recalcular hashes e assinaturas. Lote cancelado ou sem lances tem auditoria (cadeia vazia,
        veredito `integro`). `selo` é null enquanto o lote não foi encerrado nem cancelado. O veredito
        reflete o banco no momento da consulta, por isso a resposta nunca é cacheada
        (`Cache-Control: no-store`). Lote inexistente, ou id que não é UUID, é 404 `NAO_ENCONTRADO`.
        Só pseudônimos: nenhum nome, e-mail nem id de usuário. Rate limit (specs/011 §Rate limit),
        contado junto com `GET /api/auditoria/chaves`: **até a tarefa 020 (`trustProxy`, F5), só um
        teto global de 600 requisições por minuto** (sem limite fino por IP: atrás do Caddy todos os
        clientes teriam o mesmo IP; risco aceito, como em specs/003); **a partir da 020, 60 por minuto
        por IP** (IPv6 agrupado por /64). Acima do limite, 429 `MUITAS_TENTATIVAS` com `Retry-After`.
        O contador conta depois da validação de formato (id que não é UUID é 404 e não o consome).
        Janela fixa: rajada de até 2 vezes o limite na virada. Redis fora: falha **aberta** (a
        requisição passa, com aviso de log). Todas as respostas, inclusive os erros, são `no-store`.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Auditoria do lote.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaAuditoria' }
              example:
                sucesso: true
                dados:
                  lote:
                    id: '0198f3c0-7b1a-7c00-8000-000000000001'
                    titulo: Black Lotus
                    cartaNome: Black Lotus
                    status: ao_vivo
                    inicioEm: '2026-10-27T14:00:00.000Z'
                    fimEm: '2026-10-27T14:30:00.000Z'
                    totalLances: 1
                  lances:
                    - seq: 1
                      pseudonimo: 'Licitante #3fa9c1'
                      valorCentavos: 15000
                      criadoEm: '2026-10-27T14:03:07.120Z'
                      hashAnterior: '82842ba46c36a8e7ea4d91bab2695ec3281f83824f6b9c91af66cbaef0423585'
                      hash: 'af1bac38780142da599db0996414d71a5a5b98ad198b2c0c8f7a1bf55abdd8cb'
                      assinatura: 'MOumYMXLSRf1yq3BzD9MT4kPV0kMPUFw4cUEvbCd-u90psSijUKdOoE4nO9hy__a9mAzFP3ygg-RNp5DNRDyDQ'
                      keyId: '21fe31dfa154a261'
                  selo: null
                  veredito: integro
                  problemas: []
        '404': { $ref: '#/components/responses/ErroNaoEncontradoNoStore' }
        '429': { $ref: '#/components/responses/ErroMuitasTentativasNoStore' }
        '503':
          $ref: '#/components/responses/ErroIndisponivelNoStore'
          description: |
            Dependência fora (banco; INDISPONIVEL), com mensagem fixa e sem `detalhes`. Nunca cacheado.
            O Redis fora **não** causa este erro nas rotas públicas de leitura: o rate limit delas falha
            aberto (specs/011 §Rate limit). Nesta rota, o 503 `INDISPONIVEL` também ocorre, além do
            banco indisponível, quando o lote passa do teto de 1000 lances (a cadeia nunca é truncada)
            ou quando a leitura excede o `statement_timeout` de 5 s (specs/011 §Teto da cadeia e tempo
            das consultas).
        default: { $ref: '#/components/responses/Erro' }

  /api/auditoria/chaves:
    get:
      tags: [auditoria]
      operationId: auditoriaChaves
      summary: Chaves públicas Ed25519 que já assinaram lances ou selos, público (specs/008 §Chaves)
      description: |
        Lê `signing_keys`, ordenada por `ativaDesde` crescente (desempate `keyId`); a chave antiga
        continua publicada depois de uma rotação. `Cache-Control: public, max-age=60`. O navegador que
        encontrar um `keyId` ausente da lista refaz a consulta uma vez antes de acusar problema.
        Mesmo contador e mesmo regime de rate limit de `GET /api/auditoria/lotes/{id}` (teto global de
        600 por minuto até a tarefa 020, 60 por minuto por IP depois; falha aberta se o Redis cair;
        specs/011 §Rate limit). O 429 e o 503 saem com `Cache-Control: no-store`; só o 200 é
        `public, max-age=60`.
      security: []
      responses:
        '200':
          description: Chaves públicas publicadas.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlChaves' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaChaves' }
              example:
                sucesso: true
                dados:
                  - keyId: '21fe31dfa154a261'
                    algoritmo: Ed25519
                    chavePublica: '11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo'
                    ativaDesde: '2026-10-25T12:00:00.000Z'
        '429': { $ref: '#/components/responses/ErroMuitasTentativasNoStore' }
        '503': { $ref: '#/components/responses/ErroIndisponivelNoStore' }
        default: { $ref: '#/components/responses/Erro' }

  /api/painel/lotes:
    post:
      tags: [painel]
      operationId: painelCriarLote
      summary: Cria um lote a partir de uma carta, só leiloeiro (specs/006 RF-01)
      description: |
        Validação (422, `detalhes.campo` com o primeiro campo inválido) antes de qualquer chamada
        externa; depois o snapshot é preparado fora da transação e gravado junto com o lote, tudo
        ou nada (specs/005 §Snapshot). Falha no snapshot: 503 (`CATALOGO_OCUPADO` |
        `CATALOGO_INDISPONIVEL`, com `tenteNovamenteEm` e `Retry-After`) ou 422 com
        `detalhes.campo` `scryfallId` (carta inexistente ou sem imagem). Status gravado: `ao_vivo`
        se `inicioEm` ≤ agora, senão `agendado`. Sem `Idempotency-Key` na F2.
      security:
        - cookieAcesso: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoteEntrada' }
      responses:
        '201':
          description: Lote criado.
          content:
            application/json:
              schema:
                type: object
                required: [sucesso, dados]
                additionalProperties: false
                properties:
                  sucesso: { const: true }
                  dados: { $ref: '#/components/schemas/Lote' }
        '401': { $ref: '#/components/responses/ErroNaoAutenticado' }
        '403': { $ref: '#/components/responses/ErroCsrfOuPapel' }
        '422': { $ref: '#/components/responses/ErroDadosInvalidosComCampo' }
        '503': { $ref: '#/components/responses/ErroCatalogo' }
        default: { $ref: '#/components/responses/Erro' }
    get:
      tags: [painel]
      operationId: painelListarLotes
      summary: Lotes do próprio leiloeiro, inclusive cancelados (specs/006 RF-05)
      description: |
        Do mais recente para o mais antigo (`criado_em` decrescente, desempate `id` decrescente);
        24 por página (`meta.limite` = 24); `pagina` de 1 a 500; além da última, 200 com lista vazia.
      parameters:
        - $ref: '#/components/parameters/PaginaLimitada'
      responses:
        '200':
          description: Página dos lotes do usuário.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaListaDeLotes' }
        '401': { $ref: '#/components/responses/ErroNaoAutenticado' }
        '403': { $ref: '#/components/responses/ErroPapelNaoPermitido' }
        '422': { $ref: '#/components/responses/ErroDadosInvalidosComCampo' }
        default: { $ref: '#/components/responses/Erro' }

  /api/painel/resumo:
    get:
      tags: [painel]
      operationId: painelResumo
      summary: Total recebido e contagens dos lotes encerrados do leiloeiro (specs/006 RF-05)
      description: |
        Conta só lotes do usuário com status gravado `encerrado`. Sem lote encerrado, os três
        valores são 0.
      responses:
        '200':
          description: Resumo do painel.
          content:
            application/json:
              schema:
                type: object
                required: [sucesso, dados]
                additionalProperties: false
                properties:
                  sucesso: { const: true }
                  dados: { $ref: '#/components/schemas/ResumoDoPainel' }
        '401': { $ref: '#/components/responses/ErroNaoAutenticado' }
        '403': { $ref: '#/components/responses/ErroPapelNaoPermitido' }
        default: { $ref: '#/components/responses/Erro' }

  /api/painel/lotes/{id}/cancelamento:
    post:
      tags: [painel]
      operationId: painelCancelarLote
      summary: Cancela o lote do próprio leiloeiro, com estorno do líder (specs/006 RF-04, specs/010)
      description: |
        Só enquanto o lote está `agendado` ou `ao_vivo`; sem corpo. Antes da transação, nesta ordem:
        CSRF (403 `CSRF_INVALIDO`), sessão (401), papel (403 `PAPEL_NAO_PERMITIDO`) e `id` que não é
        UUID (404 `NAO_ENCONTRADO`). Uma transação, com o lote travado por `FOR UPDATE` antes das
        carteiras (specs/010 §Cancelamento): lote inexistente ou de outro leiloeiro → 404
        `NAO_ENCONTRADO` (os dois casos são indistinguíveis); status gravado `encerrado` ou
        `cancelado`, ou horário do Postgres ≥ `fimEm` (o job ainda não encerrou o lote) → 409
        `LOTE_ENCERRADO`. Com líder, estorna o comprometido dele e sela o histórico com status
        `cancelado`; tudo ou nada. A resposta é o `Lote` lido depois do COMMIT (status `cancelado`).
        O valor estornado é o `compromisso` lido sob o lock do lote, nunca um valor do cliente.
        Repetir o pedido depois do sucesso → 409 `LOTE_ENCERRADO`. Contenção de lock além de 5 s
        (`lock_timeout`) ou consulta além de 10 s (`statement_timeout`) → rollback e 503
        `INDISPONIVEL` sem `detalhes`. Depois do COMMIT saem os eventos `lote_cancelado` e, se havia líder,
        `saldo_atualizado` para ele (specs/009).
      security:
        - cookieAcesso: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Lote cancelado.
          content:
            application/json:
              schema:
                type: object
                required: [sucesso, dados]
                additionalProperties: false
                properties:
                  sucesso: { const: true }
                  dados: { $ref: '#/components/schemas/Lote' }
              example:
                sucesso: true
                dados:
                  id: '0198f3c0-7b1a-7c00-8000-000000000001'
                  titulo: Black Lotus
                  status: cancelado
                  cartaNome: Black Lotus
                  raridade: rare
                  imagemUrl: /api/imagens/0198f3c0-7b1a-7c00-8000-0000000000a1
                  inicioEm: '2026-10-27T14:00:00.000Z'
                  fimEm: '2026-10-27T14:30:00.000Z'
                  lanceInicialCentavos: 10000
                  incrementoMinimoCentavos: 1500
                  lanceAtualCentavos: 16500
                  precoAtualCentavos: 16500
                  totalLances: 2
                  valorArremateCentavos: null
                  criadoEm: '2026-10-27T13:50:00.000Z'
        '401': { $ref: '#/components/responses/ErroNaoAutenticado' }
        '403': { $ref: '#/components/responses/ErroCsrfOuPapel' }
        '404': { $ref: '#/components/responses/ErroNaoEncontrado' }
        '409': { $ref: '#/components/responses/ErroLoteEncerradoNoCancelamento' }
        '503': { $ref: '#/components/responses/ErroIndisponivel' }
        default: { $ref: '#/components/responses/Erro' }

  /api/comprovantes/{codigo}:
    get:
      tags: [comprovantes]
      operationId: comprovanteObter
      summary: Comprovante de arremate pelo código público, sem login (specs/011)
      description: |
        O acesso público é só pelo `codigo` (16 caracteres base62 aleatórios, cerca de 95 bits;
        anti-IDOR). Código fora do formato `^[0-9A-Za-z]{16}$` e código inexistente respondem o mesmo
        404 `NAO_ENCONTRADO`, sem pista de qual foi o caso. Nunca chama a Scryfall: a imagem é
        `/api/imagens/{snapshotId}`. Só pseudônimo: nenhum nome, e-mail nem id de usuário. Nunca
        cacheada: o 200 e os erros (404, 429, 503) saem com `Cache-Control: no-store`. Rate limit com
        contador próprio, separado do da auditoria (specs/011 §Rate limit): **até a tarefa 020
        (`trustProxy`, F5), só um teto global de 600 requisições por minuto** (sem limite fino por IP;
        risco aceito, como em specs/003); **a partir da 020, 60 por minuto por IP** (IPv6 agrupado por
        /64). Acima do limite, 429 `MUITAS_TENTATIVAS` com `Retry-After`. O contador conta depois da
        validação de formato (código malformado é 404 e não o consome). Janela fixa: rajada de até 2
        vezes o limite na virada. Redis fora: falha **aberta** (a requisição passa, com aviso de log).
      security: []
      parameters:
        - name: codigo
          in: path
          required: true
          description: '`codigo` do comprovante; o formato é validado pelo servidor (malformado → 404).'
          schema: { type: string }
      responses:
        '200':
          description: Comprovante.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaComprovante' }
              example:
                sucesso: true
                dados:
                  codigo: k3Zt9QmW2xVbN7aD
                  vencedorPseudonimo: 'Licitante #b04e7d'
                  valorCentavos: 16500
                  carta:
                    nome: Black Lotus
                    imagemUrl: /api/imagens/0198f3c0-7b1a-7c00-8000-0000000000a1
                  hashFinal: '70110ba5cbdcbd8f62e443939427c9182717a6273e4b5b2bea997034a5427e93'
                  assinaturaSelo: 'LBufCwppRc8LYu11Cam_IkR9Wu1cx-63pBnrnGYbHfy8MExN_wQR-cuvTM6KAtVsrAFCfWnaHX2sWNb2zXKvCA'
                  keyId: '21fe31dfa154a261'
                  seladoEm: '2026-10-27T14:30:00.412Z'
                  emitidoEm: '2026-10-27T14:30:00.431Z'
                  auditoriaUrl: /auditoria/0198f3c0-7b1a-7c00-8000-000000000001
        '404': { $ref: '#/components/responses/ErroNaoEncontradoNoStore' }
        '429': { $ref: '#/components/responses/ErroMuitasTentativasNoStore' }
        '503': { $ref: '#/components/responses/ErroIndisponivelNoStore' }
        default: { $ref: '#/components/responses/Erro' }

  /api/me/arremates:
    get:
      tags: [comprovantes]
      operationId: meArrematesListar
      summary: Lotes arrematados pelo licitante, com o comprovante (specs/011 RF-03)
      description: |
        Só os recibos do próprio usuário (nunca de outro), por `emitidoEm` decrescente (desempate
        `id` do recibo decrescente); **24 por página** (`meta.limite` = 24); `pagina` de 1 a 500;
        além da última, 200 com lista vazia e o `total` real. Só licitante: leiloeiro recebe 403
        `PAPEL_NAO_PERMITIDO`. Sem nome, e-mail nem id de usuário. Nunca cacheada
        (`Cache-Control: no-store`, também nos erros 401, 403, 422 e 503). A aba "Meus lances" usa
        `GET /api/me/lances`. Sem rate limit (rota autenticada).
      security:
        - cookieAcesso: []
      parameters:
        - $ref: '#/components/parameters/PaginaLimitada'
      responses:
        '200':
          description: Página dos arremates do usuário.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaMeusArremates' }
              example:
                sucesso: true
                dados:
                  - codigo: k3Zt9QmW2xVbN7aD
                    valorCentavos: 16500
                    carta:
                      nome: Black Lotus
                      imagemUrl: /api/imagens/0198f3c0-7b1a-7c00-8000-0000000000a1
                    emitidoEm: '2026-10-27T14:30:00.431Z'
                    auditoriaUrl: /auditoria/0198f3c0-7b1a-7c00-8000-000000000001
                meta: { total: 1, pagina: 1, limite: 24 }
        '401': { $ref: '#/components/responses/ErroNaoAutenticadoNoStore' }
        '403': { $ref: '#/components/responses/ErroPapelNaoPermitidoNoStore' }
        '422': { $ref: '#/components/responses/ErroDadosInvalidosComCampoNoStore' }
        '503': { $ref: '#/components/responses/ErroIndisponivelNoStore' }
        default: { $ref: '#/components/responses/Erro' }

components:
  securitySchemes:
    cookieAcesso:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT HS256 de 15 min; atributos em specs/003 §Cookies.
    cookieRefresh:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        Token opaco de 256 bits, 7 dias; atributos em specs/003 §Cookies. Com Path=/api/auth (casa por
        prefixo), o cookie chega às rotas sob /api/auth (incluindo refresh e logout) e não às demais
        rotas da API. Só refresh e logout o leem; o login revoga a família de um refresh_token recebido.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Deve ser igual ao cookie `csrf_token` (não httpOnly); comparação em tempo constante.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID gerado pelo cliente por operação.
      schema: { type: string, format: uuid }
    Pagina:
      name: pagina
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PaginaLimitada:
      name: pagina
      in: query
      required: false
      description: Página de 1 a 500; o teto evita OFFSET sem limite (specs/005 e specs/006).
      schema: { type: integer, minimum: 1, maximum: 500, default: 1 }

  headers:
    # Atributos dos cookies (specs/003 §Cookies). "Secure em produção": ausente só em dev (http://localhost).
    CookieCsrf:
      description: |
        `csrf_token=<aleatório>; Path=/; Max-Age=604800; SameSite=Lax; Secure` (Secure em produção; sem HttpOnly).
      schema: { type: string }
    CookiesDeSessao:
      description: |
        Um Set-Cookie por cookie:
        - `access_token=<JWT>; Path=/; Max-Age=900; HttpOnly; SameSite=Lax; Secure` (Secure em produção);
        - `refresh_token=<opaco>; Path=/api/auth; Max-Age=604800; HttpOnly; SameSite=Lax; Secure` (Secure em produção);
        - `csrf_token=<aleatório>; Path=/; Max-Age=604800; SameSite=Lax; Secure` (Secure em produção; sem HttpOnly).
      schema: { type: string }
    CookiesExpirados:
      description: |
        Um Set-Cookie por cookie, com valor vazio, `Max-Age=0` e os mesmos Path, HttpOnly, SameSite e
        Secure da emissão: `access_token` (Path=/), `refresh_token` (Path=/api/auth) e `csrf_token` (Path=/).
      schema: { type: string }
    RetryAfter:
      description: Segundos até a próxima tentativa ser aceita.
      required: true
      schema: { type: integer, minimum: 1 }
    CacheControlImagem:
      description: Sempre `public, max-age=31536000, immutable` (specs/005).
      required: true
      schema: { type: string, const: 'public, max-age=31536000, immutable' }
    ETagImagem:
      description: SHA-256 dos bytes da imagem, em hexadecimal minúsculo, entre aspas (specs/005).
      required: true
      schema: { type: string, pattern: '^"[0-9a-f]{64}"$' }
    CacheControlNoStore:
      description: 'Sempre `no-store`: a resposta reflete o banco no momento da consulta (specs/007, specs/008).'
      required: true
      schema: { type: string, const: no-store }
    CacheControlChaves:
      description: Sempre `public, max-age=60` (specs/008 §Interfaces e contratos).
      required: true
      schema: { type: string, const: 'public, max-age=60' }

  schemas:
    Uuid: { type: string, format: uuid }
    Centavos:
      description: Valor monetário em centavos inteiros (nunca float). Duplicado no asyncapi.yaml.
      type: integer
      minimum: 0
      maximum: 9007199254740991
    Instante: { type: string, format: date-time }
    Papel:
      type: string
      enum: [leiloeiro, licitante]
    Email:
      type: string
      format: email
      maxLength: 254

    Usuario:
      type: object
      required: [id, nome, email, papel]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nome: { type: string, minLength: 2, maxLength: 80 }
        email: { $ref: '#/components/schemas/Email' }
        papel: { $ref: '#/components/schemas/Papel' }

    CadastroEntrada:
      type: object
      required: [nome, email, senha, papel]
      additionalProperties: false
      properties:
        nome: { type: string, minLength: 2, maxLength: 80 }
        email:
          description: Único, sem diferenciar maiúsculas.
          allOf: [{ $ref: '#/components/schemas/Email' }]
        senha: { type: string, minLength: 10, maxLength: 128 }
        papel: { $ref: '#/components/schemas/Papel' }

    LoginEntrada:
      type: object
      required: [email, senha]
      additionalProperties: false
      properties:
        email: { $ref: '#/components/schemas/Email' }
        senha: { type: string, minLength: 1, maxLength: 128 }

    RespostaUsuarioLogado:
      type: object
      required: [sucesso, dados]
      additionalProperties: false
      properties:
        sucesso: { const: true }
        dados:
          type: object
          required: [usuario]
          additionalProperties: false
          properties:
            usuario: { $ref: '#/components/schemas/Usuario' }

    Saldo:
      type: object
      required: [totalCentavos, comprometidoCentavos, disponivelCentavos]
      additionalProperties: false
      properties:
        totalCentavos: { $ref: '#/components/schemas/Centavos' }
        comprometidoCentavos: { $ref: '#/components/schemas/Centavos' }
        disponivelCentavos: { $ref: '#/components/schemas/Centavos' }

    DepositoEntrada:
      type: object
      required: [valorCentavos]
      additionalProperties: false
      properties:
        valorCentavos: { type: integer, minimum: 100, maximum: 10000000 }

    TipoLancamento:
      type: string
      enum: [deposito, compromisso, liberacao, estorno, debito_arremate, credito_arremate]

    Lancamento:
      type: object
      required: [id, tipo, valorCentavos, loteId, criadoEm]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        tipo: { $ref: '#/components/schemas/TipoLancamento' }
        valorCentavos:
          description: Sempre positivo; o efeito no saldo depende do tipo (specs/004 §Comportamento).
          type: integer
          minimum: 1
          maximum: 9007199254740991
        loteId:
          description: Lote que causou o lançamento; null em depósitos.
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        criadoEm: { $ref: '#/components/schemas/Instante' }

    RespostaDeposito:
      type: object
      required: [sucesso, dados]
      additionalProperties: false
      properties:
        sucesso: { const: true }
        dados:
          type: object
          required: [lancamento, saldo]
          additionalProperties: false
          properties:
            lancamento: { $ref: '#/components/schemas/Lancamento' }
            saldo: { $ref: '#/components/schemas/Saldo' }

    EstadoDeSaude:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { const: ok }

    MetaPaginacao:
      type: object
      required: [total, pagina, limite]
      additionalProperties: false
      properties:
        total: { type: integer, minimum: 0 }
        pagina: { type: integer, minimum: 1 }
        limite: { type: integer, minimum: 1 }

    Raridade:
      description: Raridades da Scryfall (specs/006).
      type: string
      enum: [common, uncommon, rare, mythic, special, bonus]

    StatusLote:
      description: |
        Status derivado dos horários (specs/006 §Estados e status derivado); `cancelado` só aparece
        no painel e no detalhe, nunca na vitrine.
      type: string
      enum: [agendado, ao_vivo, encerrado, cancelado]

    CartaDaBusca:
      description: Carta do resultado da busca (specs/005). Ainda sem snapshot.
      type: object
      required: [scryfallId, nome, colecao, raridade, tipo, artista, imagemUrl]
      additionalProperties: false
      properties:
        scryfallId: { $ref: '#/components/schemas/Uuid' }
        nome: { type: string }
        colecao: { type: string }
        raridade: { $ref: '#/components/schemas/Raridade' }
        tipo: { type: string }
        artista:
          oneOf:
            - { type: string }
            - { type: 'null' }
        imagemUrl:
          description: |
            Miniatura `small` na Scryfall (`https://cards.scryfall.io/...`; ADR 0029); null se a
            carta não tiver imagem.
          oneOf:
            - { type: string, format: uri }
            - { type: 'null' }

    Carta:
      description: Campos do snapshot da carta, sem a imagem (`catalogo.obterSnapshot`, specs/005).
      type: object
      required: [scryfallId, nome, colecao, raridade, tipo, textoOracle, artista]
      additionalProperties: false
      properties:
        scryfallId: { $ref: '#/components/schemas/Uuid' }
        nome: { type: string }
        colecao: { type: string }
        raridade: { $ref: '#/components/schemas/Raridade' }
        tipo: { type: string }
        textoOracle:
          oneOf:
            - { type: string }
            - { type: 'null' }
        artista:
          oneOf:
            - { type: string }
            - { type: 'null' }

    Lote:
      description: |
        Resumo do lote (vitrine, painel e criação; specs/006). Nunca leva nome nem e-mail de
        usuário.
      type: object
      required:
        - id
        - titulo
        - status
        - cartaNome
        - raridade
        - imagemUrl
        - inicioEm
        - fimEm
        - lanceInicialCentavos
        - incrementoMinimoCentavos
        - lanceAtualCentavos
        - precoAtualCentavos
        - totalLances
        - valorArremateCentavos
        - criadoEm
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        titulo: { type: string, minLength: 1, maxLength: 120 }
        status: { $ref: '#/components/schemas/StatusLote' }
        cartaNome: { type: string }
        raridade: { $ref: '#/components/schemas/Raridade' }
        imagemUrl:
          description: '`/api/imagens/{snapshotId}`.'
          type: string
          pattern: '^/api/imagens/[0-9a-fA-F-]{36}$'
        inicioEm: { $ref: '#/components/schemas/Instante' }
        fimEm: { $ref: '#/components/schemas/Instante' }
        lanceInicialCentavos: { $ref: '#/components/schemas/Centavos' }
        incrementoMinimoCentavos: { $ref: '#/components/schemas/Centavos' }
        lanceAtualCentavos:
          description: Null enquanto não há lance.
          oneOf:
            - { $ref: '#/components/schemas/Centavos' }
            - { type: 'null' }
        precoAtualCentavos:
          description: '`coalesce(lanceAtualCentavos, lanceInicialCentavos)`, o preço da faixa e da ordem `maior_lance`.'
          allOf: [{ $ref: '#/components/schemas/Centavos' }]
        totalLances: { type: integer, minimum: 0 }
        valorArremateCentavos:
          description: Valor do arremate do lote encerrado com vencedor; null nos demais casos.
          oneOf:
            - { $ref: '#/components/schemas/Centavos' }
            - { type: 'null' }
        criadoEm: { $ref: '#/components/schemas/Instante' }

    LoteDetalhe:
      description: |
        Detalhe do lote (specs/006 §Detalhe): os campos de `Lote` mais descrição, fim original, o
        snapshot da carta sem a imagem e a posição do usuário. Mude os campos de `Lote` junto.
      type: object
      required:
        - id
        - titulo
        - descricao
        - status
        - cartaNome
        - raridade
        - carta
        - imagemUrl
        - inicioEm
        - fimEm
        - fimOriginalEm
        - lanceInicialCentavos
        - incrementoMinimoCentavos
        - lanceAtualCentavos
        - precoAtualCentavos
        - totalLances
        - valorArremateCentavos
        - suaPosicao
        - criadoEm
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        titulo: { type: string, minLength: 1, maxLength: 120 }
        descricao:
          oneOf:
            - { type: string, maxLength: 2000 }
            - { type: 'null' }
        status: { $ref: '#/components/schemas/StatusLote' }
        cartaNome: { type: string }
        raridade: { $ref: '#/components/schemas/Raridade' }
        carta: { $ref: '#/components/schemas/Carta' }
        imagemUrl:
          description: '`/api/imagens/{snapshotId}`.'
          type: string
          pattern: '^/api/imagens/[0-9a-fA-F-]{36}$'
        inicioEm: { $ref: '#/components/schemas/Instante' }
        fimEm: { $ref: '#/components/schemas/Instante' }
        fimOriginalEm: { $ref: '#/components/schemas/Instante' }
        lanceInicialCentavos: { $ref: '#/components/schemas/Centavos' }
        incrementoMinimoCentavos: { $ref: '#/components/schemas/Centavos' }
        lanceAtualCentavos:
          oneOf:
            - { $ref: '#/components/schemas/Centavos' }
            - { type: 'null' }
        precoAtualCentavos: { $ref: '#/components/schemas/Centavos' }
        totalLances: { type: integer, minimum: 0 }
        valorArremateCentavos:
          oneOf:
            - { $ref: '#/components/schemas/Centavos' }
            - { type: 'null' }
        suaPosicao:
          description: |
            `ganhando` (lote ao vivo e o usuário lidera), `venceu` (lote encerrado e o usuário
            venceu); null nos demais casos e para anônimos. Só as colunas de `lots` (specs/006).
          oneOf:
            - { type: string, enum: [ganhando, venceu] }
            - { type: 'null' }
        criadoEm: { $ref: '#/components/schemas/Instante' }

    LoteEntrada:
      description: Corpo da criação do lote; limites e regras em specs/006 §Criação.
      type: object
      required: [scryfallId, lanceInicialCentavos, incrementoMinimoCentavos, inicioEm, fimEm]
      additionalProperties: false
      properties:
        scryfallId: { $ref: '#/components/schemas/Uuid' }
        titulo:
          description: Opcional; ausente, null ou só espaços → o nome da carta, truncado em 120 caracteres.
          oneOf:
            - { type: string, minLength: 1, maxLength: 120 }
            - { type: 'null' }
        descricao:
          description: Opcional; vazia ou só espaços → sem descrição.
          oneOf:
            - { type: string, maxLength: 2000 }
            - { type: 'null' }
        lanceInicialCentavos: { type: integer, minimum: 100, maximum: 100000000 }
        incrementoMinimoCentavos: { type: integer, minimum: 100, maximum: 100000000 }
        inicioEm:
          description: Instante com fuso; não pode ser mais de 1 minuto no passado.
          allOf: [{ $ref: '#/components/schemas/Instante' }]
        fimEm:
          description: Pelo menos 5 minutos depois de `inicioEm` e no máximo 7 dias depois.
          allOf: [{ $ref: '#/components/schemas/Instante' }]

    RespostaListaDeLotes:
      type: object
      required: [sucesso, dados, meta]
      additionalProperties: false
      properties:
        sucesso: { const: true }
        dados:
          type: array
          maxItems: 24
          items: { $ref: '#/components/schemas/Lote' }
        meta: { $ref: '#/components/schemas/MetaPaginacao' }

    ResumoDoPainel:
      description: Só lotes do usuário com status gravado `encerrado` (specs/006 §Painel).
      type: object
      required: [totalRecebidoCentavos, lotesArrematados, lotesSemLance]
      additionalProperties: false
      properties:
        totalRecebidoCentavos: { $ref: '#/components/schemas/Centavos' }
        lotesArrematados: { type: integer, minimum: 0 }
        lotesSemLance: { type: integer, minimum: 0 }

    Pseudonimo:
      description: Pseudônimo estável por lote (specs/008). Duplicado no asyncapi.yaml.
      type: string
      pattern: '^Licitante #[0-9a-f]{6}$'

    LanceEntrada:
      description: Corpo do lance; campo desconhecido é 422 `DADOS_INVALIDOS`.
      type: object
      required: [valorCentavos]
      additionalProperties: false
      properties:
        valorCentavos: { type: integer, minimum: 1, maximum: 9007199254740991 }

    Lance:
      description: |
        Lance pseudonimizado (specs/007). Nunca leva o id interno, o id do licitante, nome nem e-mail.
      type: object
      required: [seq, pseudonimo, valorCentavos, criadoEm]
      additionalProperties: false
      properties:
        seq: { type: integer, minimum: 1 }
        pseudonimo: { $ref: '#/components/schemas/Pseudonimo' }
        valorCentavos: { $ref: '#/components/schemas/Centavos' }
        criadoEm:
          description: ISO 8601 UTC com 3 casas de milissegundo (a forma assinada, specs/008).
          allOf: [{ $ref: '#/components/schemas/Instante' }]

    LoteDoLance:
      description: Estado do lote logo depois do lance aceito (`fimEm` já com a extensão, se houve).
      type: object
      required: [lanceAtualCentavos, fimEm, totalLances]
      additionalProperties: false
      properties:
        lanceAtualCentavos: { $ref: '#/components/schemas/Centavos' }
        fimEm: { $ref: '#/components/schemas/Instante' }
        totalLances: { type: integer, minimum: 1 }

    RespostaLance:
      type: object
      required: [sucesso, dados]
      additionalProperties: false
      properties:
        sucesso: { const: true }
        dados:
          type: object
          required: [lance, lote]
          additionalProperties: false
          properties:
            lance: { $ref: '#/components/schemas/Lance' }
            lote: { $ref: '#/components/schemas/LoteDoLance' }

    RespostaListaDeLances:
      type: object
      required: [sucesso, dados, meta]
      additionalProperties: false
      properties:
        sucesso: { const: true }
        dados:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Lance' }
        meta: { $ref: '#/components/schemas/MetaPaginacao' }

    PosicaoDoLicitante:
      description: |
        Posição em um lote em que o usuário deu lance (specs/007 §Posição do usuário no lote);
        `sem_lance` não aparece aqui porque a lista só traz lotes com lance do usuário.
      type: string
      enum: [ganhando, superado, venceu, perdeu]

    LanceDoUsuario:
      type: object
      required: [lote, posicao, meuMaiorLanceCentavos, meuUltimoLanceEm]
      additionalProperties: false
      properties:
        lote: { $ref: '#/components/schemas/Lote' }
        posicao: { $ref: '#/components/schemas/PosicaoDoLicitante' }
        meuMaiorLanceCentavos: { $ref: '#/components/schemas/Centavos' }
        meuUltimoLanceEm: { $ref: '#/components/schemas/Instante' }

    RespostaMeusLances:
      type: object
      required: [sucesso, dados, meta]
      additionalProperties: false
      properties:
        sucesso: { const: true }
        dados:
          type: array
          maxItems: 24
          items: { $ref: '#/components/schemas/LanceDoUsuario' }
        meta: { $ref: '#/components/schemas/MetaPaginacao' }

    HashHex:
      description: SHA-256 em 64 caracteres hexadecimais minúsculos (specs/008 §Forma canônica).
      type: string
      pattern: '^[0-9a-f]{64}$'

    AssinaturaBase64Url:
      description: Assinatura Ed25519 de 64 bytes em base64url sem padding (86 caracteres).
      type: string
      pattern: '^[A-Za-z0-9_-]{86}$'

    KeyId:
      description: Os 16 primeiros caracteres hex minúsculos de SHA-256 da chave pública (specs/008 §Chaves).
      type: string
      pattern: '^[0-9a-f]{16}$'

    LanceDaCadeia:
      description: Lance com os campos de integridade (specs/008), para recalcular a cadeia no navegador.
      type: object
      required: [seq, pseudonimo, valorCentavos, criadoEm, hashAnterior, hash, assinatura, keyId]
      additionalProperties: false
      properties:
        seq: { type: integer, minimum: 1 }
        pseudonimo: { $ref: '#/components/schemas/Pseudonimo' }
        valorCentavos: { $ref: '#/components/schemas/Centavos' }
        criadoEm: { $ref: '#/components/schemas/Instante' }
        hashAnterior: { $ref: '#/components/schemas/HashHex' }
        hash: { $ref: '#/components/schemas/HashHex' }
        assinatura: { $ref: '#/components/schemas/AssinaturaBase64Url' }
        keyId: { $ref: '#/components/schemas/KeyId' }

    SeloDoLote:
      description: Selo assinado no encerramento ou no cancelamento (specs/008 §Técnica).
      type: object
      required:
        - status
        - totalLances
        - hashFinal
        - vencedorPseudonimo
        - valorArremateCentavos
        - seladoEm
        - assinatura
        - keyId
      additionalProperties: false
      properties:
        status: { type: string, enum: [encerrado, cancelado] }
        totalLances: { type: integer, minimum: 0 }
        hashFinal:
          description: '`hash` do último lance, ou o hash da gênese se `totalLances` for 0.'
          allOf: [{ $ref: '#/components/schemas/HashHex' }]
        vencedorPseudonimo:
          description: Null em lote cancelado ou sem lance.
          oneOf:
            - { $ref: '#/components/schemas/Pseudonimo' }
            - { type: 'null' }
        valorArremateCentavos:
          description: Null em lote cancelado ou sem lance.
          oneOf:
            - { $ref: '#/components/schemas/Centavos' }
            - { type: 'null' }
        seladoEm: { $ref: '#/components/schemas/Instante' }
        assinatura: { $ref: '#/components/schemas/AssinaturaBase64Url' }
        keyId: { $ref: '#/components/schemas/KeyId' }

    CodigoDeProblema:
      description: Códigos da verificação, iguais no servidor e no navegador (specs/008 §Verificação).
      type: string
      enum:
        - SEQ_FORA_DE_ORDEM
        - HASH_ANTERIOR_DIVERGENTE
        - HASH_DIVERGENTE
        - ASSINATURA_INVALIDA
        - CHAVE_DESCONHECIDA
        - SELO_TOTAL_DIVERGENTE
        - SELO_HASH_FINAL_DIVERGENTE
        - SELO_ASSINATURA_INVALIDA

    ProblemaDeIntegridade:
      type: object
      required: [codigo, seq, mensagem]
      additionalProperties: false
      properties:
        codigo: { $ref: '#/components/schemas/CodigoDeProblema' }
        seq:
          description: '`seq` do lance com problema; null nos problemas do selo.'
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: 'null' }
        mensagem: { type: string }

    LoteDaAuditoria:
      description: Identificação do lote auditado, sem dado de usuário.
      type: object
      required: [id, titulo, cartaNome, status, inicioEm, fimEm, totalLances]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        titulo: { type: string, minLength: 1, maxLength: 120 }
        cartaNome: { type: string }
        status: { $ref: '#/components/schemas/StatusLote' }
        inicioEm: { $ref: '#/components/schemas/Instante' }
        fimEm: { $ref: '#/components/schemas/Instante' }
        totalLances: { type: integer, minimum: 0 }

    Auditoria:
      description: |
        Cadeia completa e veredito do servidor. `veredito` `integro` se e só se `problemas` está vazio.
        A gênese (`hashAnterior` do lance 1) é SHA-256 de `leilao-verzel:genesis:` + `lote.id`.
      type: object
      required: [lote, lances, selo, veredito, problemas]
      additionalProperties: false
      properties:
        lote: { $ref: '#/components/schemas/LoteDaAuditoria' }
        lances:
          type: array
          items: { $ref: '#/components/schemas/LanceDaCadeia' }
        selo:
          oneOf:
            - { $ref: '#/components/schemas/SeloDoLote' }
            - { type: 'null' }
        veredito: { type: string, enum: [integro, adulterado] }
        problemas:
          type: array
          items: { $ref: '#/components/schemas/ProblemaDeIntegridade' }

    RespostaAuditoria:
      type: object
      required: [sucesso, dados]
      additionalProperties: false
      properties:
        sucesso: { const: true }
        dados: { $ref: '#/components/schemas/Auditoria' }

    ChavePublica:
      type: object
      required: [keyId, algoritmo, chavePublica, ativaDesde]
      additionalProperties: false
      properties:
        keyId: { $ref: '#/components/schemas/KeyId' }
        algoritmo: { const: Ed25519 }
        chavePublica:
          description: 32 bytes da chave pública em base64url sem padding (43 caracteres).
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        ativaDesde: { $ref: '#/components/schemas/Instante' }

    RespostaChaves:
      type: object
      required: [sucesso, dados]
      additionalProperties: false
      properties:
        sucesso: { const: true }
        dados:
          type: array
          items: { $ref: '#/components/schemas/ChavePublica' }

    CodigoDoComprovante:
      description: |
        Código público do comprovante: 16 caracteres base62 aleatórios, cerca de 95 bits (specs/010
        §Dados). É a única chave de acesso público ao comprovante.
      type: string
      pattern: '^[0-9A-Za-z]{16}$'

    CartaDoComprovante:
      description: Nome e imagem da carta; a imagem é sempre `/api/imagens/{snapshotId}`, nunca a Scryfall.
      type: object
      required: [nome, imagemUrl]
      additionalProperties: false
      properties:
        nome: { type: string }
        imagemUrl:
          type: string
          pattern: '^/api/imagens/[0-9a-fA-F-]{36}$'

    Comprovante:
      description: |
        Comprovante de arremate (specs/011), sem dados pessoais: nenhum nome, e-mail nem id de
        usuário. `hashFinal`, `assinaturaSelo`, `keyId` e `seladoEm` são os do selo do lote
        (specs/008) gravados no recibo; `valorCentavos` e `vencedorPseudonimo` são os do selo.
        `auditoriaUrl` é a rota da SPA, `/auditoria/{loteId}`.
      type: object
      required:
        - codigo
        - vencedorPseudonimo
        - valorCentavos
        - carta
        - hashFinal
        - assinaturaSelo
        - keyId
        - seladoEm
        - emitidoEm
        - auditoriaUrl
      additionalProperties: false
      properties:
        codigo: { $ref: '#/components/schemas/CodigoDoComprovante' }
        vencedorPseudonimo: { $ref: '#/components/schemas/Pseudonimo' }
        valorCentavos: { $ref: '#/components/schemas/Centavos' }
        carta: { $ref: '#/components/schemas/CartaDoComprovante' }
        hashFinal: { $ref: '#/components/schemas/HashHex' }
        assinaturaSelo: { $ref: '#/components/schemas/AssinaturaBase64Url' }
        keyId: { $ref: '#/components/schemas/KeyId' }
        seladoEm: { $ref: '#/components/schemas/Instante' }
        emitidoEm: { $ref: '#/components/schemas/Instante' }
        auditoriaUrl:
          type: string
          pattern: '^/auditoria/[0-9a-fA-F-]{36}$'

    RespostaComprovante:
      type: object
      required: [sucesso, dados]
      additionalProperties: false
      properties:
        sucesso: { const: true }
        dados: { $ref: '#/components/schemas/Comprovante' }

    Arremate:
      description: |
        Item de "Meus arremates" (specs/011): o resumo do comprovante do próprio usuário. O comprovante
        completo está em `GET /api/comprovantes/{codigo}` e a rota da SPA é `/comprovantes/{codigo}`.
        Sem nome, e-mail nem id de usuário.
      type: object
      required: [codigo, valorCentavos, carta, emitidoEm, auditoriaUrl]
      additionalProperties: false
      properties:
        codigo: { $ref: '#/components/schemas/CodigoDoComprovante' }
        valorCentavos: { $ref: '#/components/schemas/Centavos' }
        carta: { $ref: '#/components/schemas/CartaDoComprovante' }
        emitidoEm: { $ref: '#/components/schemas/Instante' }
        auditoriaUrl:
          type: string
          pattern: '^/auditoria/[0-9a-fA-F-]{36}$'

    RespostaMeusArremates:
      type: object
      required: [sucesso, dados, meta]
      additionalProperties: false
      properties:
        sucesso: { const: true }
        dados:
          type: array
          maxItems: 24
          items: { $ref: '#/components/schemas/Arremate' }
        meta: { $ref: '#/components/schemas/MetaPaginacao' }

    Erro:
      type: object
      required: [sucesso, erro]
      additionalProperties: false
      properties:
        sucesso: { const: false }
        erro:
          type: object
          required: [codigo, mensagem]
          additionalProperties: false
          properties:
            codigo:
              type: string
              enum:
                - DADOS_INVALIDOS
                - NAO_AUTENTICADO
                - CSRF_INVALIDO
                - PAPEL_NAO_PERMITIDO
                - NAO_ENCONTRADO
                - MUITAS_TENTATIVAS
                - CREDENCIAIS_INVALIDAS
                - EMAIL_EM_USO
                - SESSAO_EXPIRADA
                - SALDO_INSUFICIENTE
                - LANCE_ABAIXO_DO_MINIMO
                - JA_ESTA_GANHANDO
                - LOTE_NAO_INICIADO
                - LOTE_ENCERRADO
                - LEILOEIRO_NAO_PODE_LANCAR
                - CATALOGO_INDISPONIVEL
                - CATALOGO_OCUPADO
                - INDISPONIVEL
            mensagem: { type: string }
            detalhes: { type: object, additionalProperties: true }

  responses:
    SaudeOk:
      description: Processo vivo (live) ou dependências respondendo (ready).
      content:
        application/json:
          schema:
            type: object
            required: [sucesso, dados]
            additionalProperties: false
            properties:
              sucesso: { const: true }
              dados: { $ref: '#/components/schemas/EstadoDeSaude' }
    Erro:
      description: |
        Qualquer erro não listado na rota, no envelope padrão (specs/001 §Erros): 4xx do framework
        com o próprio status e o código da tabela de specs/001 (400, 409, 413, 414, 415, 422 e
        demais → DADOS_INVALIDOS; 401 → NAO_AUTENTICADO; 403 → PAPEL_NAO_PERMITIDO; 404 e 405 →
        NAO_ENCONTRADO; 429 → MUITAS_TENTATIVAS, com `Retry-After`), 5xx do framework com o
        próprio status (por exemplo 503) e INDISPONIVEL, e 500 INDISPONIVEL para erro não tratado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    ErroIndisponivel:
      description: |
        Dependência fora ou não verificada (INDISPONIVEL), com mensagem fixa e sem `detalhes`.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro:
                    required: [codigo]
                    properties:
                      codigo: { const: INDISPONIVEL }
                      detalhes: false
    # Respostas por código: o envelope Erro com `codigo` fixo.
    ErroDadosInvalidos:
      description: |
        Corpo, parâmetro ou header fora do contrato, incluindo campo desconhecido e `Idempotency-Key`
        repetida com corpo diferente (DADOS_INVALIDOS).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: DADOS_INVALIDOS } } }
    ErroDadosInvalidosComCampo:
      description: |
        Parâmetro ou corpo fora do contrato (DADOS_INVALIDOS), com `detalhes.campo` = nome do
        primeiro campo inválido (specs/006 §Criação, specs/005).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro:
                    required: [codigo, detalhes]
                    properties:
                      codigo: { const: DADOS_INVALIDOS }
                      detalhes:
                        type: object
                        additionalProperties: false
                        required: [campo]
                        properties:
                          campo: { type: string }
    ErroPapelNaoPermitido:
      description: Rota restrita a outro papel (PAPEL_NAO_PERMITIDO).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: PAPEL_NAO_PERMITIDO } } }
    ErroNaoEncontrado:
      description: Recurso inexistente, ou id que não é UUID (NAO_ENCONTRADO).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: NAO_ENCONTRADO } } }
    ErroCatalogo:
      description: |
        Catálogo sem condição de chamar a Scryfall (specs/005): `CATALOGO_OCUPADO` (sem ficha do
        bucket em 1 s; `tenteNovamenteEm` 1) ou `CATALOGO_INDISPONIVEL` (circuito aberto, Redis fora
        ou falha do upstream). `detalhes.tenteNovamenteEm` (segundos inteiros ≥ 1) é igual ao
        header `Retry-After`.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro:
                    required: [codigo, detalhes]
                    properties:
                      codigo: { enum: [CATALOGO_OCUPADO, CATALOGO_INDISPONIVEL] }
                      detalhes:
                        type: object
                        additionalProperties: false
                        required: [tenteNovamenteEm]
                        properties:
                          tenteNovamenteEm: { type: integer, minimum: 1 }
    ErroNaoAutenticado:
      description: Sem cookie `access_token` válido (NAO_AUTENTICADO).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: NAO_AUTENTICADO } } }
    ErroCsrfInvalido:
      description: Header `X-CSRF-Token` ausente ou diferente do cookie `csrf_token` (CSRF_INVALIDO).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: CSRF_INVALIDO } } }
    ErroCsrfOuPapel:
      description: |
        CSRF inválido (CSRF_INVALIDO) ou rota restrita a outro papel (PAPEL_NAO_PERMITIDO).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro:
                    required: [codigo]
                    properties: { codigo: { enum: [CSRF_INVALIDO, PAPEL_NAO_PERMITIDO] } }
    ErroCredenciaisInvalidas:
      description: E-mail inexistente ou senha errada, com a mesma mensagem (CREDENCIAIS_INVALIDAS).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: CREDENCIAIS_INVALIDAS } } }
    ErroEmailEmUso:
      description: E-mail já cadastrado, sem diferenciar maiúsculas (EMAIL_EM_USO).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: EMAIL_EM_USO } } }
    ErroSessaoExpirada:
      description: Refresh token ausente, expirado, revogado ou reutilizado (SESSAO_EXPIRADA).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: SESSAO_EXPIRADA } } }
    ErroMuitasTentativas:
      description: Limite de tentativas excedido (MUITAS_TENTATIVAS).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: MUITAS_TENTATIVAS } } }
    ErroCsrfOuLeiloeiro:
      description: |
        CSRF inválido (CSRF_INVALIDO) ou papel `leiloeiro` dando lance (LEILOEIRO_NAO_PODE_LANCAR,
        specs/007; a rota de lance não usa PAPEL_NAO_PERMITIDO).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro:
                    required: [codigo]
                    properties: { codigo: { enum: [CSRF_INVALIDO, LEILOEIRO_NAO_PODE_LANCAR] } }
    ErroLanceRecusado:
      description: |
        Lance recusado ou corpo inválido (422), na ordem de specs/007 §Transação. `LANCE_ABAIXO_DO_MINIMO`
        leva `detalhes.minimoCentavos` e `SALDO_INSUFICIENTE` leva `detalhes.disponivelCentavos`;
        `DADOS_INVALIDOS` também cobre a `Idempotency-Key` ausente, que não é UUID, ou repetida com
        outro lote ou valor. `detalhes` só tem valores primitivos.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro:
                    oneOf:
                      - required: [codigo]
                        properties:
                          codigo:
                            enum: [DADOS_INVALIDOS, LOTE_ENCERRADO, LOTE_NAO_INICIADO, JA_ESTA_GANHANDO]
                      - required: [codigo, detalhes]
                        properties:
                          codigo: { const: LANCE_ABAIXO_DO_MINIMO }
                          detalhes:
                            type: object
                            additionalProperties: false
                            required: [minimoCentavos]
                            properties:
                              minimoCentavos: { $ref: '#/components/schemas/Centavos' }
                      - required: [codigo, detalhes]
                        properties:
                          codigo: { const: SALDO_INSUFICIENTE }
                          detalhes:
                            type: object
                            additionalProperties: false
                            required: [disponivelCentavos]
                            properties:
                              disponivelCentavos: { $ref: '#/components/schemas/Centavos' }
          examples:
            abaixoDoMinimo:
              summary: Lance abaixo do mínimo
              value:
                sucesso: false
                erro:
                  codigo: LANCE_ABAIXO_DO_MINIMO
                  mensagem: O lance é menor que o mínimo.
                  detalhes: { minimoCentavos: 16500 }
            saldoInsuficiente:
              summary: Saldo disponível insuficiente
              value:
                sucesso: false
                erro:
                  codigo: SALDO_INSUFICIENTE
                  mensagem: Saldo disponível insuficiente.
                  detalhes: { disponivelCentavos: 12000 }
    ErroLoteEncerradoNoCancelamento:
      description: |
        O lote não pode mais ser cancelado (409 `LOTE_ENCERRADO`, specs/010 §Cancelamento): já está
        `encerrado` ou `cancelado`, ou o horário do Postgres chegou ao `fimEm` e o job ainda não o
        encerrou. Sem `detalhes`.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: LOTE_ENCERRADO } } }
    # Variantes com `Cache-Control: no-store` para as rotas de auditoria, comprovante e meus
    # arremates (specs/011 §Interfaces e contratos): o erro também nunca é cacheado.
    ErroNaoEncontradoNoStore:
      description: Recurso inexistente, ou id/código malformado, com o mesmo corpo (NAO_ENCONTRADO). Nunca cacheado.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: NAO_ENCONTRADO } } }
    ErroMuitasTentativasNoStore:
      description: |
        Limite das rotas públicas de leitura excedido (MUITAS_TENTATIVAS, specs/011 §Rate limit):
        teto global de 600 requisições por minuto por contador até a tarefa 020 (`trustProxy`, F5) e
        60 por minuto por IP depois. Nunca cacheado.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: MUITAS_TENTATIVAS } } }
    ErroNaoAutenticadoNoStore:
      description: Sem cookie `access_token` válido (NAO_AUTENTICADO). Nunca cacheado.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: NAO_AUTENTICADO } } }
    ErroPapelNaoPermitidoNoStore:
      description: Rota restrita a outro papel (PAPEL_NAO_PERMITIDO). Nunca cacheado.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: PAPEL_NAO_PERMITIDO } } }
    ErroDadosInvalidosComCampoNoStore:
      description: |
        Parâmetro fora do contrato (DADOS_INVALIDOS), com `detalhes.campo` = nome do primeiro campo
        inválido. Nunca cacheado.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro:
                    required: [codigo, detalhes]
                    properties:
                      codigo: { const: DADOS_INVALIDOS }
                      detalhes:
                        type: object
                        additionalProperties: false
                        required: [campo]
                        properties:
                          campo: { type: string }
    ErroIndisponivelNoStore:
      description: |
        Dependência fora (banco; INDISPONIVEL), com mensagem fixa e sem `detalhes`. Nunca cacheado.
        O Redis fora **não** causa este erro nas rotas públicas de leitura: o rate limit delas falha
        aberto (specs/011 §Rate limit).
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro:
                    required: [codigo]
                    properties:
                      codigo: { const: INDISPONIVEL }
                      detalhes: false
security:
  - cookieAcesso: []
