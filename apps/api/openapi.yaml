# Contrato REST (OpenAPI 3.1). Fonte: specs/001 e specs/003–011. Dono: spec-guardian.
# F1 (tarefa 009): rotas de specs/003 (auth) e specs/004 (carteira). As demais fases acrescentam as suas.
openapi: 3.1.0
info:
  title: Casa de Leilões API
  version: 0.2.0
  license: { name: MIT, identifier: MIT }
  description: |
    Envelope (specs/001 §Contratos): sucesso `{ sucesso: true, dados }`; erro
    `{ sucesso: false, erro: { codigo, mensagem, detalhes? } }`. Dinheiro sempre em centavos inteiros.
    Rotas que alteram estado (POST/PUT/PATCH/DELETE) exigem o header `X-CSRF-Token` igual ao cookie
    `csrf_token` (double-submit, specs/003).
servers:
  - url: http://localhost:13000
tags:
  - name: health
    description: Health checks (ADR 0018).
  - name: auth
    description: Cadastro, login, refresh, logout e sessão (specs/003).
  - name: carteira
    description: Saldo, depósito simulado e extrato do ledger (specs/004).
paths:
  /api/health/live:
    get:
      tags: [health]
      operationId: healthLive
      summary: Processo vivo
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /api/health/ready:
    get:
      tags: [health]
      operationId: healthReady
      summary: Pronto (Postgres e Redis respondendo)
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '503': { $ref: '#/components/responses/Erro' }

  /api/auth/cadastro:
    post:
      tags: [auth]
      operationId: authCadastro
      summary: Cadastro público com papel imutável (specs/003 RF-01)
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroEntrada' }
      responses:
        '201':
          description: Conta criada e sessão iniciada.
          headers:
            Set-Cookie: { $ref: '#/components/headers/CookiesDeSessao' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaUsuarioLogado' }
        '403': { $ref: '#/components/responses/ErroCsrfInvalido' }
        '409': { $ref: '#/components/responses/ErroEmailEmUso' }
        '422': { $ref: '#/components/responses/ErroDadosInvalidos' }

  /api/auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      summary: Login por e-mail e senha (specs/003 RF-02)
      description: |
        Mesma resposta para e-mail inexistente e senha errada (specs/003 RNF-03).
        Limite de 5 tentativas por minuto por IP + e-mail (specs/003 RNF-02).
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginEntrada' }
      responses:
        '200':
          description: Sessão iniciada.
          headers:
            Set-Cookie: { $ref: '#/components/headers/CookiesDeSessao' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaUsuarioLogado' }
        '401': { $ref: '#/components/responses/ErroCredenciaisInvalidas' }
        '403': { $ref: '#/components/responses/ErroCsrfInvalido' }
        '422': { $ref: '#/components/responses/ErroDadosInvalidos' }
        '429': { $ref: '#/components/responses/ErroMuitasTentativas' }

  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      summary: Troca o refresh token por um par novo, na mesma família (specs/003)
      description: |
        Lê o cookie `refresh_token`. Reuso de um token já substituído revoga a família inteira e
        responde 401 `SESSAO_EXPIRADA`.
      security:
        - cookieRefresh: []
          csrf: []
      responses:
        '204':
          description: Cookies renovados.
          headers:
            Set-Cookie: { $ref: '#/components/headers/CookiesDeSessao' }
        '401': { $ref: '#/components/responses/ErroSessaoExpirada' }
        '403': { $ref: '#/components/responses/ErroCsrfInvalido' }

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Encerra a sessão e revoga a família do refresh token (specs/003)
      security:
        - csrf: []
      responses:
        '204':
          description: Sessão encerrada; os cookies de sessão são expirados.
          headers:
            Set-Cookie: { $ref: '#/components/headers/CookiesExpirados' }
        '403': { $ref: '#/components/responses/ErroCsrfInvalido' }

  /api/auth/me:
    get:
      tags: [auth]
      operationId: authMe
      summary: Usuário da sessão atual (specs/003 RF-02)
      responses:
        '200':
          description: Usuário autenticado.
          content:
            application/json:
              schema:
                type: object
                required: [sucesso, dados]
                properties:
                  sucesso: { const: true }
                  dados: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/ErroNaoAutenticado' }

  /api/carteira:
    get:
      tags: [carteira]
      operationId: carteiraSaldo
      summary: Saldo do usuário (specs/004 RF-01, RF-02)
      description: disponivelCentavos = totalCentavos − comprometidoCentavos.
      responses:
        '200':
          description: Saldo atual (projeção `wallet_balances`).
          content:
            application/json:
              schema:
                type: object
                required: [sucesso, dados]
                properties:
                  sucesso: { const: true }
                  dados: { $ref: '#/components/schemas/Saldo' }
        '401': { $ref: '#/components/responses/ErroNaoAutenticado' }

  /api/carteira/depositos:
    post:
      tags: [carteira]
      operationId: carteiraDepositar
      summary: Depósito simulado, só licitante (specs/004 RF-03)
      description: |
        Valor entre 100 e 10.000.000 centavos (R$ 1,00 a R$ 100.000,00) por operação.
        Idempotente por (usuário, `Idempotency-Key`): repetir a chave responde 200 com o mesmo
        lançamento e o saldo atual, sem novo lançamento (por analogia a specs/007 §Comportamento).
      security:
        - cookieAcesso: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositoEntrada' }
      responses:
        '201':
          description: Depósito lançado no ledger.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaDeposito' }
        '200':
          description: Repetição da mesma `Idempotency-Key`; mesmo lançamento, saldo atual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespostaDeposito' }
        '401': { $ref: '#/components/responses/ErroNaoAutenticado' }
        '403': { $ref: '#/components/responses/ErroCsrfInvalido' }
        '422': { $ref: '#/components/responses/ErroDadosInvalidos' }

  /api/carteira/extrato:
    get:
      tags: [carteira]
      operationId: carteiraExtrato
      summary: Lançamentos do ledger do usuário, paginados (specs/004)
      description: Ordem do mais recente para o mais antigo; 20 lançamentos por página.
      parameters:
        - $ref: '#/components/parameters/Pagina'
      responses:
        '200':
          description: Página do extrato.
          content:
            application/json:
              schema:
                type: object
                required: [sucesso, dados, meta]
                properties:
                  sucesso: { const: true }
                  dados:
                    type: array
                    items: { $ref: '#/components/schemas/Lancamento' }
                  meta: { $ref: '#/components/schemas/MetaPaginacao' }
        '401': { $ref: '#/components/responses/ErroNaoAutenticado' }
        '422': { $ref: '#/components/responses/ErroDadosInvalidos' }

components:
  securitySchemes:
    cookieAcesso:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT HS256 de 15 min, httpOnly (specs/003).
    cookieRefresh:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Token opaco de 256 bits, httpOnly, Path=/api/auth/refresh, 7 dias (specs/003).
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Deve ser igual ao cookie `csrf_token` (não httpOnly); comparação em tempo constante.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID gerado pelo cliente por operação.
      schema: { type: string, format: uuid }
    Pagina:
      name: pagina
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }

  headers:
    CookiesDeSessao:
      description: Define `access_token`, `refresh_token` e `csrf_token` (atributos em specs/003).
      schema: { type: string }
    CookiesExpirados:
      description: Expira `access_token`, `refresh_token` e `csrf_token`.
      schema: { type: string }

  schemas:
    Uuid: { type: string, format: uuid }
    Centavos:
      description: Valor monetário em centavos inteiros (nunca float).
      type: integer
      minimum: 0
      maximum: 9007199254740991
    Instante: { type: string, format: date-time }
    Papel:
      type: string
      enum: [leiloeiro, licitante]

    Usuario:
      type: object
      required: [id, nome, email, papel]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nome: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        papel: { $ref: '#/components/schemas/Papel' }

    CadastroEntrada:
      type: object
      required: [nome, email, senha, papel]
      additionalProperties: false
      properties:
        nome: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email, description: 'Único, sem diferenciar maiúsculas.' }
        senha: { type: string, minLength: 10, maxLength: 128 }
        papel: { $ref: '#/components/schemas/Papel' }

    LoginEntrada:
      type: object
      required: [email, senha]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        senha: { type: string, minLength: 1, maxLength: 128 }

    RespostaUsuarioLogado:
      type: object
      required: [sucesso, dados]
      properties:
        sucesso: { const: true }
        dados:
          type: object
          required: [usuario]
          properties:
            usuario: { $ref: '#/components/schemas/Usuario' }

    Saldo:
      type: object
      required: [totalCentavos, comprometidoCentavos, disponivelCentavos]
      properties:
        totalCentavos: { $ref: '#/components/schemas/Centavos' }
        comprometidoCentavos: { $ref: '#/components/schemas/Centavos' }
        disponivelCentavos: { $ref: '#/components/schemas/Centavos' }

    DepositoEntrada:
      type: object
      required: [valorCentavos]
      additionalProperties: false
      properties:
        valorCentavos: { type: integer, minimum: 100, maximum: 10000000 }

    TipoLancamento:
      type: string
      enum: [deposito, compromisso, liberacao, estorno, debito_arremate, credito_arremate]

    Lancamento:
      type: object
      required: [id, tipo, valorCentavos, loteId, criadoEm]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        tipo: { $ref: '#/components/schemas/TipoLancamento' }
        valorCentavos:
          description: Sempre positivo; o efeito no saldo depende do tipo (specs/004 §Comportamento).
          type: integer
          minimum: 1
          maximum: 9007199254740991
        loteId:
          description: Lote que causou o lançamento; null em depósitos.
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        criadoEm: { $ref: '#/components/schemas/Instante' }

    RespostaDeposito:
      type: object
      required: [sucesso, dados]
      properties:
        sucesso: { const: true }
        dados:
          type: object
          required: [lancamento, saldo]
          properties:
            lancamento: { $ref: '#/components/schemas/Lancamento' }
            saldo: { $ref: '#/components/schemas/Saldo' }

    MetaPaginacao:
      type: object
      required: [total, pagina, limite]
      properties:
        total: { type: integer, minimum: 0 }
        pagina: { type: integer, minimum: 1 }
        limite: { type: integer, minimum: 1 }

    Erro:
      type: object
      required: [sucesso, erro]
      properties:
        sucesso: { const: false }
        erro:
          type: object
          required: [codigo, mensagem]
          properties:
            codigo:
              type: string
              enum:
                - DADOS_INVALIDOS
                - NAO_AUTENTICADO
                - CSRF_INVALIDO
                - NAO_ENCONTRADO
                - MUITAS_TENTATIVAS
                - CREDENCIAIS_INVALIDAS
                - EMAIL_EM_USO
                - SESSAO_EXPIRADA
                - SALDO_INSUFICIENTE
                - LANCE_ABAIXO_DO_MINIMO
                - JA_ESTA_GANHANDO
                - LOTE_NAO_INICIADO
                - LOTE_ENCERRADO
                - LEILOEIRO_NAO_PODE_LANCAR
                - CATALOGO_INDISPONIVEL
                - CATALOGO_OCUPADO
                - INDISPONIVEL
            mensagem: { type: string }
            detalhes: { type: object, additionalProperties: true }

  responses:
    Ok:
      description: Sucesso
      content:
        application/json:
          schema:
            type: object
            required: [sucesso, dados]
            properties:
              sucesso: { const: true }
              dados: { type: object, additionalProperties: true }
    Erro:
      description: Erro no envelope padrão
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    # Respostas por código: o envelope Erro com `codigo` fixo.
    ErroDadosInvalidos:
      description: Corpo, parâmetro ou header fora do contrato (DADOS_INVALIDOS).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: DADOS_INVALIDOS } } }
    ErroNaoAutenticado:
      description: Sem cookie `access_token` válido (NAO_AUTENTICADO).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: NAO_AUTENTICADO } } }
    ErroCsrfInvalido:
      description: Header `X-CSRF-Token` ausente ou diferente do cookie `csrf_token` (CSRF_INVALIDO).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: CSRF_INVALIDO } } }
    ErroCredenciaisInvalidas:
      description: E-mail inexistente ou senha errada, com a mesma mensagem (CREDENCIAIS_INVALIDAS).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: CREDENCIAIS_INVALIDAS } } }
    ErroEmailEmUso:
      description: E-mail já cadastrado, sem diferenciar maiúsculas (EMAIL_EM_USO).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: EMAIL_EM_USO } } }
    ErroSessaoExpirada:
      description: Refresh token ausente, expirado, revogado ou reutilizado (SESSAO_EXPIRADA).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: SESSAO_EXPIRADA } } }
    ErroMuitasTentativas:
      description: Limite de tentativas excedido (MUITAS_TENTATIVAS).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Erro'
              - required: [erro]
                properties:
                  erro: { required: [codigo], properties: { codigo: { const: MUITAS_TENTATIVAS } } }
security:
  - cookieAcesso: []
