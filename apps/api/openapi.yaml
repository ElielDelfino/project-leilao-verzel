# Contrato REST (OpenAPI 3.1). Fonte: specs/001 e specs/003–011. Dono: spec-guardian.
# Esqueleto inicial; a tarefa 009 completa as rotas da F1 e liga a validação no CI.
openapi: 3.1.0
info:
  title: Casa de Leilões API
  version: 0.1.0
  license: { name: MIT, identifier: MIT }
servers:
  - url: http://localhost:13000
tags:
  - name: health
paths:
  /api/health/live:
    get:
      tags: [health]
      summary: Processo vivo
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /api/health/ready:
    get:
      tags: [health]
      summary: Pronto (Postgres e Redis respondendo)
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '503': { $ref: '#/components/responses/Erro' }
components:
  securitySchemes:
    cookieAcesso: { type: apiKey, in: cookie, name: access_token }
    csrf: { type: apiKey, in: header, name: X-CSRF-Token }
  schemas:
    Erro:
      type: object
      required: [sucesso, erro]
      properties:
        sucesso: { const: false }
        erro:
          type: object
          required: [codigo, mensagem]
          properties:
            codigo:
              type: string
              enum:
                - DADOS_INVALIDOS
                - NAO_AUTENTICADO
                - CSRF_INVALIDO
                - NAO_ENCONTRADO
                - MUITAS_TENTATIVAS
                - CREDENCIAIS_INVALIDAS
                - EMAIL_EM_USO
                - SESSAO_EXPIRADA
                - SALDO_INSUFICIENTE
                - LANCE_ABAIXO_DO_MINIMO
                - JA_ESTA_GANHANDO
                - LOTE_NAO_INICIADO
                - LOTE_ENCERRADO
                - LEILOEIRO_NAO_PODE_LANCAR
                - CATALOGO_INDISPONIVEL
                - CATALOGO_OCUPADO
                - INDISPONIVEL
            mensagem: { type: string }
            detalhes: { type: object, additionalProperties: true }
  responses:
    Ok:
      description: Sucesso
      content:
        application/json:
          schema:
            type: object
            required: [sucesso, dados]
            properties:
              sucesso: { const: true }
              dados: { type: object }
    Erro:
      description: Erro no envelope padrão
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
security:
  - cookieAcesso: []
